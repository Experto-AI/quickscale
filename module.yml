# Blog Module Manifest
# Defines configuration options and their mutability for the blog module

name: blog
version: "0.89.0"
description: "Markdown-powered blog module"

config:
  mutable:
    posts_per_page:
      type: integer
      default: 10
      django_setting: BLOG_POSTS_PER_PAGE
      description: "Number of blog posts per page"
      validation:
        min: 1

    api_rate_limit:
      type: string
      default: "5/hour"
      django_setting: BLOG_API_RATE_LIMIT
      description: "Throttle rate for authenticated blog API requests (per IP). Format: '<count>/<period>'."
      validation:
        pattern: ^\d+/(second|minute|hour|day)$

    enable_rss:
      type: boolean
      default: true
      django_setting: BLOG_ENABLE_RSS
      description: "Enable RSS routes at runtime"
      validation: {}

  immutable: {}

required_modules:
  - orgs

dependencies:
  - djangorestframework>=3.17.2
  - django-markdownx>=4.0.11
  - Pillow>=12.3.0,<13.0.0

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - markdownx
          - quickscale_modules_blog
      description: "Blog Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - blog/
            - quickscale_modules_blog.urls
          - - markdownx/
            - markdownx.urls
      description: "Blog URL includes"

  option_derivations:
    api_rate_limit:
      normalization_rules:
        - source_key: api_rate_limit
          target_key: api_rate_limit
          rule_type: strip
          description: "Strip whitespace from api_rate_limit"
