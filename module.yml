# Forms Module Manifest
# Defines configuration options and their mutability for the Forms module
# See decisions.md §Module Manifest Architecture for schema specification

name: forms
version: "0.87.0"
description: "Generic, customizable form builder module with admin management and React frontend renderer."

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    forms_per_page:
      type: integer
      default: 25
      django_setting: FORMS_PER_PAGE
      description: "Number of submissions shown per page in admin."

    spam_protection_enabled:
      type: boolean
      default: true
      django_setting: FORMS_SPAM_PROTECTION
      description: "Enable honeypot spam protection globally for forms that also keep their per-form flag enabled."

    rate_limit:
      type: string
      default: "5/hour"
      django_setting: FORMS_RATE_LIMIT
      description: "Throttle rate for form submissions (per IP). Format: '<count>/<period>'."

    data_retention_days:
      type: integer
      default: 365
      django_setting: FORMS_DATA_RETENTION_DAYS
      description: "Default days assigned to newly created forms before anonymization (0 = keep forever); existing forms keep their stored value."

    submissions_api_enabled:
      type: boolean
      default: true
      django_setting: FORMS_SUBMISSIONS_API
      description: "Enable REST API endpoints for admin submission management."

  # Immutable options - locked at embed time, require remove + re-embed to change
  immutable: {}

# Dependencies required by this module
dependencies:
  - djangorestframework>=3.17.1
  - django-filter>=26.1

# Django apps that must be in INSTALLED_APPS
django_apps:
  - rest_framework
  - django_filters
  - quickscale_modules_forms

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - quickscale_modules_forms
      description: "Forms Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - ""
            - quickscale_modules_forms.urls
      description: "Forms URL includes"

  option_derivations:
    forms_per_page:
      derived_settings:
        - setting_key: FORMS_PER_PAGE
          source_options: [forms_per_page]
          derivation_type: direct
          expression:
            option: forms_per_page
          default: 25
          description: "Number of forms per page"

    spam_protection_enabled:
      derived_settings:
        - setting_key: FORMS_SPAM_PROTECTION
          source_options: [spam_protection_enabled]
          derivation_type: direct
          expression:
            option: spam_protection_enabled
          default: true
          description: "Enable honeypot spam protection"

    rate_limit:
      derived_settings:
        - setting_key: FORMS_RATE_LIMIT
          source_options: [rate_limit]
          derivation_type: direct
          expression:
            option: rate_limit
          description: "Throttle rate for form submissions"

    data_retention_days:
      derived_settings:
        - setting_key: FORMS_DATA_RETENTION_DAYS
          source_options: [data_retention_days]
          derivation_type: direct
          expression:
            option: data_retention_days
          default: 365
          description: "Data retention period in days"

    submissions_api_enabled:
      derived_settings:
        - setting_key: FORMS_SUBMISSIONS_API
          source_options: [submissions_api_enabled]
          derivation_type: direct
          expression:
            option: submissions_api_enabled
          default: true
          description: "Enable REST API for submission management"
