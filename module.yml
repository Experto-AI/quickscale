# Blog Module Manifest
# Defines configuration options and their mutability for the blog module

name: blog
version: "0.89.0"
description: "Markdown-powered blog module"

config:
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_BLOG_ENABLED
      description: "Enable the blog module. Off keeps the module installed with its data intact and mounts none of its public URLs."
      validation: {}

    posts_per_page:
      type: integer
      default: 10
      django_setting: QUICKSCALE_BLOG_POSTS_PER_PAGE
      description: "Number of blog posts per page"
      validation:
        min: 1

    api_rate_limit:
      type: string
      default: "5/hour"
      django_setting: QUICKSCALE_BLOG_API_RATE_LIMIT
      description: "Throttle rate for authenticated blog API requests (per IP). Format: '<count>/<period>'."
      validation:
        pattern: ^\d+/(second|minute|hour|day)$

    rss_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_BLOG_RSS_ENABLED
      description: "Enable RSS routes at runtime"
      validation: {}

    api_upload_max_bytes:
      type: integer
      default: 10485760
      django_setting: QUICKSCALE_BLOG_API_UPLOAD_MAX_BYTES
      description: "Maximum accepted media-upload size in bytes."
      validation:
        min: 1

    api_upload_max_width:
      type: integer
      default: 4096
      django_setting: QUICKSCALE_BLOG_API_UPLOAD_MAX_WIDTH
      description: "Maximum accepted media-upload image width in pixels."
      validation:
        min: 1

    api_upload_max_height:
      type: integer
      default: 4096
      django_setting: QUICKSCALE_BLOG_API_UPLOAD_MAX_HEIGHT
      description: "Maximum accepted media-upload image height in pixels."
      validation:
        min: 1

    api_allowed_image_formats:
      type: list
      default: ["PNG", "JPEG", "WEBP", "GIF"]
      django_setting: QUICKSCALE_BLOG_API_ALLOWED_IMAGE_FORMATS
      description: "Image formats accepted by the media-upload API, matched case-insensitively."
      validation:
        not_empty: true
        choices: ["PNG", "JPEG", "WEBP", "GIF"]

  immutable: {}

required_modules:
  - orgs

dependencies:
  - djangorestframework>=3.17.2
  - django-markdownx>=4.0.11
  - Pillow>=12.3.0,<13.0.0

# Retired option keys are refused by name with the message declared here.
retired_options:
  enable_rss: >-
    Legacy config key 'enable_rss' is no longer supported. Use 'rss_enabled'
    instead.

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - markdownx
          - quickscale_modules_blog
      description: "Blog Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - blog/
            - quickscale_modules_blog.urls
          - - markdownx/
            - quickscale_modules_blog.markdownx_urls
      description: "Blog URL includes; the Markdownx editor mount is staff-guarded"

  option_derivations:
    api_rate_limit:
      normalization_rules:
        - source_key: api_rate_limit
          target_key: api_rate_limit
          rule_type: strip
          description: "Strip whitespace from api_rate_limit"
