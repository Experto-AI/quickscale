# CRM Module Manifest
# Defines configuration options and their mutability for the CRM module
# See docs/technical/module_architecture.md §Module Manifest Architecture for schema specification

name: crm
version: "0.89.0"
description: "Lightweight CRM module with contacts, companies, deals, and pipeline management"

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_CRM_ENABLED
      description: "Enable the CRM module. Off keeps the module installed with its data intact and mounts none of its public URLs."
      validation: {}

    api_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_CRM_API_ENABLED
      description: "Enable REST API endpoints at /crm/api/"
      validation: {}

    deals_per_page:
      type: integer
      default: 25
      django_setting: QUICKSCALE_CRM_DEALS_PER_PAGE
      description: "Number of deals per page in list views"
      validation:
        min: 1

    contacts_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_CONTACTS_PER_PAGE
      description: "Number of contacts per page in list views"
      validation:
        min: 1

    tags_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_TAGS_PER_PAGE
      description: "Number of tags per page in the tag list API"
      validation:
        min: 1

    companies_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_COMPANIES_PER_PAGE
      description: "Number of companies per page in the company list API"
      validation:
        min: 1

    stages_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_STAGES_PER_PAGE
      description: "Number of pipeline stages per page in the stage list API"
      validation:
        min: 1

    contact_notes_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_CONTACT_NOTES_PER_PAGE
      description: "Number of contact notes per page in the contact note list APIs"
      validation:
        min: 1

    deal_notes_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_DEAL_NOTES_PER_PAGE
      description: "Number of deal notes per page in the deal note list APIs"
      validation:
        min: 1

  immutable: {}

required_modules:
  - orgs

# Dependencies required by this module (bare names; specs live in pyproject.toml)
dependencies:
  - djangorestframework
  - django-filter
  - quickscale-core

# Retired option keys are refused by name with the message declared here.
retired_options:
  default_pipeline_stages: >-
    Legacy config key 'default_pipeline_stages' is no longer supported. Remove
    it from the CRM module options.
  enable_api: >-
    Legacy config key 'enable_api' is no longer supported. Use 'api_enabled'
    instead.

# Retired Django setting names are refused at startup with the message
# declared here; the generic settings check reads this section.
retired_settings:
  CRM_CONTACTS_PER_PAGE: >-
    Legacy setting 'CRM_CONTACTS_PER_PAGE' is no longer supported. Use
    'QUICKSCALE_CRM_CONTACTS_PER_PAGE' instead.
  CRM_DEALS_PER_PAGE: >-
    Legacy setting 'CRM_DEALS_PER_PAGE' is no longer supported. Use
    'QUICKSCALE_CRM_DEALS_PER_PAGE' instead.
  CRM_ENABLE_API: >-
    Legacy setting 'CRM_ENABLE_API' is no longer supported. Use
    'QUICKSCALE_CRM_API_ENABLED' instead.

# ---------------------------------------------------------------------------
# Manifest derivation rules
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - quickscale_modules_crm
      description: "CRM Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - crm/
            - quickscale_modules_crm.urls
      description: "CRM URL includes"

    - wiring_field: spa_routes
      derivation_type: static
      expression:
        value:
          - - ^crm/?$
            - shell
      description: "CRM React shell route; rendered after the module's own includes (rule 41)"
