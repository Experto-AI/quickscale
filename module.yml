# Auth Module Manifest
# Defines configuration options and their mutability for the auth module
# See decisions.md §Module Manifest Architecture for schema specification

name: auth
version: "0.89.0"
description: "Production-ready authentication module using django-allauth"

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    registration_enabled:
      type: boolean
      default: true
      django_setting: ACCOUNT_ALLOW_REGISTRATION
      description: "Allow new user registration"

    email_verification:
      type: string
      default: "none"
      django_setting: ACCOUNT_EMAIL_VERIFICATION
      description: "Email verification requirement (none, optional, mandatory)"
      validation:
        choices: ["none", "optional", "mandatory"]

    session_cookie_age:
      type: integer
      default: 1209600
      django_setting: SESSION_COOKIE_AGE
      description: "Session cookie lifetime in seconds (default: 2 weeks)"

  # Immutable options - locked at embed time, require remove + re-embed to change
  immutable:
    authentication_method:
      type: string
      default: "email"
      description: "Authentication method (email, username, both)"
      validation:
        choices: ["email", "username", "both"]

# Dependencies required by this module
dependencies:
  - django-allauth>=65.18.0,<66.0.0

# Required first-party modules with minimum versions
required_modules:
  - orgs>=0.86.0

# Modules implied when this module is selected
implies:
  - name: orgs

contract_vintage:
  minimum: "0.89.0"
  manual_adoption_steps:
    - "Compare and manually adopt the current templates/base.html, templates/index.html, and generated templates/social/*.html files so every DEBUG host loads the Vite-served /static/frontend/src/index.css, production loads frontend/assets/index.css, and the shell restores the persisted theme."
    - "Compare and manually adopt the current frontend/vite.config.ts static proxy rule so Vite serves /static/frontend/ directly instead of forwarding that path to Django."
    - "Compare and manually adopt the current <package>/settings/local.py QUICKSCALE_FRONTEND_HOST_PORT and QUICKSCALE_FRONTEND_ORIGIN settings so DEBUG React and module pages use the same browser-visible Vite stylesheet URL."
    - "Compare and manually adopt the current docker-compose.yml frontend workflow so it builds assets before starting Vite, publishes ${QUICKSCALE_FRONTEND_HOST_PORT:-5173}:5173, passes the port and optional full origin to Django, and waits for the Vite-served stylesheet."
    - "Run pnpm dev alongside Django for DEBUG module pages; run pnpm build so static/frontend/assets/index.css exists before serving non-DEBUG module pages."

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - django.contrib.sites
          - quickscale_modules_auth
          - allauth
          - allauth.account
      description: "Auth Django app labels"
