name: orgs
version: "0.88.0"
description: "Organizations and multi-tenant foundations with memberships and invitations"

config:
  mutable:
    mode:
      type: string
      default: "solo"
      django_setting: QUICKSCALE_MODE
      description: "Organization runtime mode (solo or saas)"
      validation:
        choices: ["solo", "saas"]
  immutable: {}

required_modules:
  - auth

dependencies:
  - django-allauth>=65.18.0,<66.0.0

implies:
  - name: notifications

middleware:
  - quickscale_modules_orgs.middleware.TenantMiddleware

settings:
  ACCOUNT_ADAPTER: quickscale_modules_orgs.adapters.OrgsAccountAdapter
  QUICKSCALE_MODE: solo

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - quickscale_modules_orgs
      description: "Orgs Django app label"
