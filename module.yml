# Listings Module Manifest
# Defines configuration options and their mutability for the listings module

name: listings
version: "0.89.0"
description: "Generic listings module for marketplace-style products"

config:
  mutable:
    listings_per_page:
      type: integer
      default: 12
      django_setting: LISTINGS_PER_PAGE
      description: "Number of listings per page"
      validation:
        min: 1

  immutable: {}

required_modules:
  - orgs>=0.86.0

dependencies:
  - django-filter>=26.1
  - django-markdownx>=4.0.11
  - Pillow>=12.3.0,<13.0.0

implies:
  - name: orgs

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - django_filters
          - markdownx
          - quickscale_modules_listings
      description: "Listings Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - listings/
            - quickscale_modules_listings.urls
          - - markdownx/
            - markdownx.urls
      description: "Listings URL includes"

  option_derivations:
    listings_per_page:
      normalization_rules:
        - source_key: listings_per_page
          target_key: listings_per_page
          rule_type: strip
          description: "Strip whitespace from listings_per_page"
