services:
  postgres:
    image: postgres:18-alpine
    labels:
      com.quickscale.owner: "quickscale"
      com.quickscale.lifecycle: "e2e"
      com.quickscale.scope: "${QS_E2E_RESOURCE_SCOPE:-qscaletest}"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432"  # Dynamic port - Docker will assign an available host port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql

volumes:
  postgres_test_data:
    labels:
      com.quickscale.owner: "quickscale"
      com.quickscale.lifecycle: "e2e"
      com.quickscale.scope: "${QS_E2E_RESOURCE_SCOPE:-qscaletest}"

networks:
  default:
    labels:
      com.quickscale.owner: "quickscale"
      com.quickscale.lifecycle: "e2e"
      com.quickscale.scope: "${QS_E2E_RESOURCE_SCOPE:-qscaletest}"
