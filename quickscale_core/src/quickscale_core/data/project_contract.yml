# Generated-project contract vintage declaration (SA207).
#
# Every change to a generated-project runtime contract is declared here once,
# with the manual adoption steps an existing project follows to catch up.
# Module manifests keep only module-specific boundaries; template contract
# changes live here.
#
# Each step's `id` is recorded in `.quickscale/state.yml`
# (`project.adopted_contract_steps`) when a project is generated or when its
# operator confirms adoption, so a project generated before the step existed
# cannot pass on a shared package version alone. `minimum` documents the
# QuickScale version that introduced the contract. `apply`, `update`, and
# `deploy railway` refuse while any declared step id is missing and name the
# outstanding steps; confirming adoption records every declared id and the
# highest declared minimum, so a caught-up project no longer needs the
# per-invocation acknowledgement flag. A changed contract gets a new step id.
#
# `scripts/check_project_contract_vintage.py` fails when a commit changes a
# template the generator emits into a generated project, a generator change
# alters the emitted file set, or a module manifest's `contract_vintage` step
# text changes without a new id. The watched template set derives from the
# generator's emission mapping, not a hand-listed path set. A new id must be
# unused by every other declaration: adopted ids share one namespace in
# applied state, so a colliding id would make an adopted project pass a
# different step.
steps:
  - id: sa192-shared-design
    minimum: "0.89.0"
    title: "Adopt the shared design across generated templates"
    adoption_steps:
      - "Compare and manually adopt the current templates/base.html, templates/index.html, and generated templates/social/*.html files so every DEBUG host loads the Vite-served /static/frontend/src/index.css, production loads frontend/assets/index.css, and the shell restores the persisted theme."
      - "Compare and manually adopt the current frontend/vite.config.ts static proxy and exact HTTP/WebSocket Host enforcement so Vite serves /static/frontend/ directly and accepts only the effective browser Host: configured QUICKSCALE_FRONTEND_ORIGIN, or localhost:QUICKSCALE_FRONTEND_HOST_PORT when blank."
      - "Compare and manually adopt the current <package>/settings/local.py QUICKSCALE_FRONTEND_HOST_PORT and validated QUICKSCALE_FRONTEND_ORIGIN settings so DEBUG React and module pages use the same browser-visible Vite stylesheet URL and malformed origins fail explicitly."
      - "Compare and manually adopt the current docker-compose.yml frontend workflow so it builds assets before starting Vite, publishes ${QUICKSCALE_FRONTEND_HOST_PORT:-5173}:5173, passes the port and optional full origin to Vite and Django, probes Vite with the effective Host, and waits for the Vite-served stylesheet."
      - "Run pnpm dev alongside Django for DEBUG module pages; run pnpm build so static/frontend/assets/index.css exists before serving non-DEBUG module pages."

  - id: sa200-proxy-trust
    minimum: "0.89.0"
    title: "Adopt the gated proxy-trust contract in production settings"
    adoption_steps:
      - "Compare and manually adopt the current settings/production.py proxy-trust contract: SECURE_PROXY_SSL_HEADER is set only while USE_X_FORWARDED_FOR is enabled, so a single-host deployment (USE_X_FORWARDED_FOR=False) never trusts a client-supplied X-Forwarded-Proto header for the HTTPS redirect or secure cookies."

  - id: sa201-throttling
    minimum: "0.89.0"
    title: "Adopt the composed DRF throttling contract"
    adoption_steps:
      - "Compare and manually adopt the current settings/base.py REST_FRAMEWORK block: it composes module-supplied DRF configuration instead of replacing it, installs AnonRateThrottle, UserRateThrottle, and ScopedRateThrottle as the default throttle classes, and merges the conservative anon/user defaults with module-contributed scopes such as billing's quickscale_billing_checkout and quickscale_billing_portal rates. A wholesale REST_FRAMEWORK assignment with no throttle classes silently drops the checkout-loop bound."

  - id: sa206-runtime-settings-facade
    minimum: "0.89.0"
    title: "Adopt the quickscale_core.runtime settings facade"
    adoption_steps:
      - "Compare and manually adopt the current settings/base.py and settings/production.py imports: generated settings import the client-identity and correlation-id middleware, the proxy-trust derivation, the privileged-command/runtime-database selection, and the SECRET_KEY guard from quickscale_core.runtime.settings, keeping only user configuration; remove any inline copy of those contracts and declare the bounded quickscale-core lockstep pin in pyproject.toml."

  - id: runtime-role-contract
    minimum: "0.89.0"
    title: "Adopt the canonical runtime-role provisioning contract"
    adoption_steps:
      - "Compare and manually adopt the current settings/production.py runtime-role contract and settings/base.py RUNTIME_DB_ROLE default."
      - "Compare and manually adopt the canonical quickscale_runtime role name and grants, including GRANT CONNECT, in db/init.sql and start.sh, plus the matching runtime-role URL in .env.example and docker-compose.yml; for an existing local database, run the role/grant SQL from OPERATIONS.md with <password> set to the password in the adopted local RUNTIME_DATABASE_URL, or reset the disposable Compose database volume before starting services; keep the migrate/createcachetable privileged-command set and unsupported-argv refusal unchanged."
      - "Compare and manually adopt the current Dockerfile startup contract and OPERATIONS.md runtime-role guidance."

  - id: compose-frontend-install-retries
    minimum: "0.89.0"
    title: "Adopt the resilient frontend dependency install"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml frontend service command so the pnpm install passes --config.fetch-retries=5: a single stalled registry request would otherwise abort the whole install and leave `quickscale up` with a failed-to-start frontend on constrained links."

  - id: sa218-drf-error-shape
    minimum: "0.89.0"
    title: "Adopt the one QuickScale DRF error shape"
    adoption_steps:
      - "Compare and manually adopt the current settings/base.py REST_FRAMEWORK block: it installs quickscale_core.runtime.conventions.exception_handler as EXCEPTION_HANDLER unless a module already contributed one, so every DRF-handled API error answers {\"error\": {\"code\", \"message\", \"fields\"}} with the HTTP status carrying the error class."
  - id: sa221-identity-stem
    minimum: "0.89.0"
    title: "Adopt the quickscale_<module> identities in generated files"
    adoption_steps:
      - "Compare and manually adopt the current generated admin templates and React admin links so app admin URLs use the quickscale_<module> app labels (for example /admin/quickscale_backups/...), and rename the tenant-isolation invocation in the generated Makefile and CI workflow to `quickscale_orgs_check_tenant_isolation`."
      - "Recreate the project database after adopting: module tables, content types, permissions, and AUTH_USER_MODEL moved to the quickscale_<module> stem, so a database created under the previous names cannot be carried over."
  - id: sa225-vendor-secret-compose-route
    minimum: "0.89.0"
    title: "Adopt the Compose backend vendor-credential route"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml backend environment list: it forwards STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY, QUICKSCALE_BILLING_WEBHOOK_SECRET, RESEND_API_KEY, QUICKSCALE_NOTIFICATIONS_WEBHOOK_SECRET, POSTHOG_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, QUICKSCALE_BACKUPS_REMOTE_ACCESS_KEY_ID, and QUICKSCALE_BACKUPS_REMOTE_SECRET_ACCESS_KEY from the environment Compose sees, so a secret placed in the project's .env reaches the container and an enabled module's empty-secret startup check can pass."
  - id: sa225-vendor-secret-build-placeholders
    minimum: "0.89.0"
    title: "Superseded Dockerfile placeholder-credential step — adopt the skip-based contract instead"
    adoption_steps:
      - "Superseded: this step's placeholder-credential Dockerfile contract was replaced before adoption by the one-shot QUICKSCALE_SKIP_MODULE_CHECKS=all declared in the sa225-vendor-secret-route-generic step. Adopt that final contract; do not add placeholder credentials to the Dockerfile."
  - id: sa225-vendor-secret-route-generic
    minimum: "0.89.0"
    title: "Adopt the generic vendor-credential route and the build-time check skip"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml backend service: an env_file entry loads the project's .env into the container so a credential under any configured *_env_var name reaches it, while the explicit environment entries keep the default names available from a shell export and take precedence over env_file."
      - "Compare and manually adopt the current Dockerfile collectstatic step: it passes the one-shot QUICKSCALE_SKIP_MODULE_CHECKS=all instead of placeholder credentials, because an image build carries no runtime credentials and a configured credential name cannot be known statically; registration and every serving process keep the checks, and the launcher never sets the skip."
  - id: sa225-vendor-secret-skip-guard
    minimum: "0.89.0"
    title: "Adopt the container-side build-skip guard"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml backend environment: it clears QUICKSCALE_SKIP_MODULE_CHECKS explicitly so a build-skip value left in the project's .env (which env_file loads) can never reach a serving process, because environment entries take precedence over env_file."
  - id: sa225-generated-ci-test-credentials
    minimum: "0.89.0"
    title: "Adopt non-live vendor credentials in the generated CI workflow"
    adoption_steps:
      - "Compare and manually adopt the current .github/workflows/ci.yml job environment: when analytics, billing, or notifications is selected it defines non-live placeholder credentials (POSTHOG_API_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY, QUICKSCALE_BILLING_WEBHOOK_SECRET, RESEND_API_KEY, QUICKSCALE_NOTIFICATIONS_WEBHOOK_SECRET) so an enabled module's startup check passes in CI, which never calls the live vendors."
      - "A project that configured a custom *_env_var name adds that variable to the same job environment; the placeholders are test values only and do not belong in a serving environment."
  - id: sa217-settings-schema
    minimum: "0.89.0"
    title: "Adopt the managed settings schema import"
    adoption_steps:
      - "Add MODULE_SETTINGS_SCHEMA to the `from .modules import ...` statement in <package>/settings/base.py (or otherwise expose the managed schema to Django settings), and commit that edit: `quickscale update` refuses a dirty tree. Then run `quickscale update --confirm-contract-adoption`, which updates the embedded modules through their configured branch, regenerates settings/modules.py with the compiled schema every installed module's startup check validates against, and records the adoption. An unflagged update or apply is refused while the adoption is pending, and apply alone cannot regenerate the wiring while the embedded modules are still on an older version. Until both are in place a module refuses startup with quickscale_settings.E001."
      - "A project generated at this version or later already imports the schema; only an earlier project needs the manual edit."
  - id: sa223-theme-error-shape
    minimum: "0.89.0"
    title: "Adopt the one-shape API error parsing in the React theme client"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useApi.ts: getApiErrorMessage and getApiFieldErrors read the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}}, prefer the first field message as the actionable message, and still tolerate the pre-convention {\"error\": \"<message>\"} and {\"errors\": {...}} shapes until every module API conversion lands; without the update, a converted module API shows only a generic message or no field errors in an existing project."
      - "Optionally copy the new frontend/src/test/useApiErrors.test.ts to pin the parser behavior."
  - id: sa223-theme-error-shape-social
    minimum: "0.89.0"
    title: "Adopt one-shape error parsing in the theme's public social pages"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useApi.ts and frontend/src/hooks/usePublicSocialSurface.ts: getApiPayloadMessage reads the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}} from a raw payload, and the public social hook uses it so a non-managed error body shows its message instead of the generic contract-mismatch text."
      - "Optionally copy the current frontend/src/test/PublicSocialPages.test.tsx cases to pin the message and first-field-message behavior."
  - id: sa223-theme-error-shape-forms
    minimum: "0.89.0"
    title: "Adopt one-shape error handling in the theme's form client"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/components/forms/FormRenderer.tsx and frontend/src/hooks/useFormSchema.ts: the form client submits through the shared apiRequest client and renders the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}} — validation field errors under their fields, a field with no visible error outlet (hidden fields included, which never block submission locally) and non-field errors as a global message, and the shape's message for every other failure — and the schema hook surfaces the shape's message when the form schema cannot be fetched."
      - "Optionally copy the current frontend/src/test/FormRenderer.test.tsx cases to pin the field-error, non-field-error, shaped-message, and network-failure behavior."
  - id: sa223-orgs-url-mount
    minimum: "0.89.0"
    title: "Adopt the orgs module's /orgs/ mount and /orgs/api/ JSON API"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useOrgs.ts org API paths: the org JSON API moved from /api/orgs/... to /orgs/api/... — the org list/create endpoint is /orgs/api/ and org-scoped endpoints are /orgs/api/<slug>/... — so custom frontend code that calls /api/orgs/... updates its paths."
      - "Compare and manually adopt the current <package>/urls.py org React-shell routes: the /orgs/<slug>/ shell route excludes /orgs/api/ so the module's JSON API reaches Django instead of the shell, and the module's HTML routes (org dashboard, members, settings, invitation accept) stay at their existing /orgs/... URLs."
      - "Audit project-owned template overrides of the orgs templates (for example a copied templates/quickscale_orgs/members.html) for the retired global route names org-members-invite, org-members-invitation-revoke, and org-debug-exit, and rename them to their quickscale_orgs snake_case forms (quickscale_orgs:members_invite, quickscale_orgs:members_invitation_revoke, quickscale_orgs:debug_exit); the module's own templates already use the namespaced names."
  - id: sa223-billing-url-mount
    minimum: "0.89.0"
    title: "Adopt the billing module's /billing/ mount and /billing/api/ JSON API"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useOrgs.ts billing API path: the billing JSON API moved from /api/billing/... to /billing/api/... under the module's /billing/ mount, so custom frontend code that calls /api/billing/... updates its paths; the Stripe webhook stays at /billing/webhooks/stripe/, and the module's HTML routes (dashboard, pricing, purchase and subscription returns, portal return) keep their existing /billing/... URLs."
      - "Audit project-owned template overrides that reverse the retired kebab-case billing route names (billing-config, subscription-plans, credit-balance, credit-transactions, purchase-checkout, subscription-detail, subscription-checkout, subscription-cancel-current, billing-portal-session, billing-dashboard, pricing-page, purchase-success, purchase-cancel, subscription-success, subscription-cancel, portal-return, stripe-webhook) and rename them to their snake_case forms under quickscale_billing: (config, subscription_plans, credit_balance, credit_transactions, purchase_checkout, subscription_detail, subscription_checkout, subscription_cancel_current, portal_session, dashboard, pricing_page, purchase_success, purchase_cancel, subscription_success, subscription_cancel, portal_return, stripe_webhook)."
  - id: sa223-crm-forms-url-mount
    minimum: "0.89.0"
    title: "Adopt the crm and forms module mounts and their moved JSON APIs"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useOrgNavigation.ts, frontend/src/hooks/useFormSchema.ts, and frontend/src/components/forms/FormRenderer.tsx forms API paths: the forms JSON API moved from /api/forms/... to /forms/api/... under the module's /forms/ mount, and the staff admin API moved from /api/admin/forms/... to /forms/api/admin/forms/..., so custom frontend code that calls the retired paths updates them; the forms HTML pages keep their existing /forms/... URLs."
      - "Audit project-owned Django templates and Python code that reverse crm routes (a copied templates/quickscale_crm/*.html, or project code calling reverse('quickscale_crm:...')) for the retired kebab-case crm route names (api-root, tag-list, tag-detail, company-list, company-detail, contact-list, contact-detail, contact-notes, stage-list, stage-detail, deal-list, deal-detail, deal-notes, deal-bulk-update-stage, deal-mark-won, deal-mark-lost, contact-note-list, contact-note-detail, deal-note-list, deal-note-detail) and forms routes (form-list, form-page, form-schema, form-submit, admin-form-list, admin-submission-list, admin-submission-detail, admin-submission-export), and rename them to their snake_case forms under quickscale_crm: and quickscale_forms:. The crm HTML dashboard and JSON API keep their existing /crm/dashboard/ and /crm/api/... URLs."
      - "Audit project-owned Django templates and Python code that reverse the retired analytics-dashboard route name and rename it to quickscale_analytics:dashboard; the analytics page URL is unchanged at /analytics/."
  - id: sa219-orgs-mode-setting
    minimum: "0.89.0"
    title: "Adopt the QUICKSCALE_ORGS_MODE rename in project templates"
    adoption_steps:
      - "Compare and manually adopt the current <package>/context_processors.py: the billing dashboard URL reads the deployment mode from QUICKSCALE_ORGS_MODE instead of the retired QUICKSCALE_MODE, so a project still reading the old name sends a saas request to the solo billing path without any error."
      - "Compare and manually adopt the current templates/index.html: window.__QUICKSCALE__.owner.mode reads settings.QUICKSCALE_ORGS_MODE, so the React shell reports the deployment mode the settings actually declare."
      - "Remove QUICKSCALE_MODE from the project's settings and run `quickscale apply`: the orgs startup check refuses the retired name with the replacement named, and the managed settings/modules.py then carries QUICKSCALE_ORGS_MODE from the module's manifest."
  - id: sa219-module-enabled-flags
    minimum: "0.89.0"
    title: "Adopt per-module enabled awareness in the React module flags"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html: the blog, crm, forms, and listings entries in window.__QUICKSCALE__.modules are true only while the module is installed and its QUICKSCALE_<MODULE>_ENABLED setting is on, so a module switched off in quickscale.yml leaves the shell navigation instead of linking to URLs apply no longer mounts."
      - "Run `quickscale apply` for a project whose settings/modules.py predates the enabled option: the managed file then carries QUICKSCALE_<MODULE>_ENABLED for each of the four modules and its urls.py drops the mounts of any module switched off."
  - id: sa219-foundation-enabled-flags
    minimum: "0.89.0"
    title: "Adopt enabled awareness for the foundation modules and the remaining React flags"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html, templates/social/link_tree.html, templates/social/embeds.html, and templates/base.html: the auth, storage, backups, notifications, analytics, billing, and social entries in window.__QUICKSCALE__.modules are true only while the module is installed and its QUICKSCALE_<MODULE>_ENABLED setting is on (social no longer keys off its link-tree/embeds feature pair), both public social pages hydrate only while the social module is installed and enabled, and the shared navigation hides its Social and Embeds links in the same state, so a module switched off in quickscale.yml leaves the shell navigation instead of linking to URLs apply no longer mounts."
      - "Run `quickscale apply` for a project whose settings/modules.py predates the enabled option: the managed file then carries QUICKSCALE_AUTH_ENABLED, QUICKSCALE_BACKUPS_ENABLED, QUICKSCALE_ORGS_ENABLED, QUICKSCALE_SOCIAL_ENABLED, and QUICKSCALE_STORAGE_ENABLED, its urls.py drops the mounts of any switched-off module (auth's accounts/ mounts, orgs' orgs/ mount in either mode, social's managed /social mount), the backups scheduled create/prune runs refuse while off, and apply refuses to switch off a module another installed module requires."
  - id: sa217-schema-import-exposure
    minimum: "0.89.0"
    title: "Adopt the schema exposure annotation in the generated base settings"
    adoption_steps:
      - "Compare and manually adopt the current <package>/settings/base.py import of MODULE_SETTINGS_SCHEMA: annotate that name with `# noqa: F401` and a comment, as the generated file does, because Django exposes every uppercase global in the settings module and the generic startup check validates against settings.MODULE_SETTINGS_SCHEMA. Without the annotation the project's own ruff check reports the import as unused."
      - "A project generated at this version or later already carries the annotation; no other change is needed."
  - id: sa219-discovery-seam-producer
    minimum: "0.89.0"
    title: "Adopt the discovery-rendered React seam and its {% url %}-based module paths"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html: window.__QUICKSCALE__.modules carries a key for every shipped module (present as false when the module is absent) and its modulePaths entries reverse named routes with {% url %} instead of literal paths — crm through the crm-shell route, social through social-link-tree or social-embeds, and analytics through quickscale_analytics:dashboard. A project that keeps a literal path can link to a route apply no longer mounts."
      - "Compare and manually adopt the current <package>/urls.py: the /crm/ React shell route is named crm-shell so the seam's crm path reverses it; a project that moved that route updates the name instead of editing the seam."
  - id: sa235-module-shell-routes
    minimum: "0.89.0"
    title: "Adopt manifest-declared module React shell routes"
    adoption_steps:
      - "Compare and manually adopt the current <package>/views.py and <package>/urls.py: the React shell view `react_shell_view` now lives in views.py, urls.py imports it and imports SPA_MODULE_URLPATTERNS from <package>/urls_modules.py, and appends `urlpatterns += SPA_MODULE_URLPATTERNS` after `urlpatterns += POST_HOME_MODULE_URLPATTERNS`. The retired `^(profile|blog|listings|settings)/?$` and `^crm/?$` (named crm-shell) reservations are gone, so /blog/ and /listings/ serve the module indexes; forms keeps its host reservations because its module entrypoint renders only a mount-point div. This supersedes the sa219-discovery-seam-producer step's crm-shell guidance."
      - "Run `quickscale apply` after updating the embedded modules: it regenerates <package>/urls_modules.py from each installed and enabled module's manifest-declared spa_routes, so the CRM shell route reverses as quickscale_crm_shell and a switched-off module contributes no shell route. A project that keeps importing react_shell_view from urls.py or lacks the SPA list fails to import its URLconf after the embedded-module update."
      - "Compare and manually adopt the current templates/index.html, templates/base.html, and templates/social/*.html: the two public social pages render the shared seam (flags and {% url %}-based modulePaths) through generator/seam.py, the shared navigation reads the module's projected QUICKSCALE_SOCIAL_* path settings, and the CRM modulePaths entry reverses quickscale_crm_shell."
  - id: sa219-billing-projected-secrets
    minimum: "0.89.0"
    title: "Adopt the projected Stripe secret settings billing reads at runtime"
    adoption_steps:
      - "Update the embedded billing module to this release before applying: `quickscale apply` renders settings/modules.py from the embedded module's adapter, so an apply against a project whose `modules/billing` predates this release still writes no QUICKSCALE_BILLING_PUBLISHABLE_KEY, QUICKSCALE_BILLING_SECRET_KEY, or QUICKSCALE_BILLING_WEBHOOK_SECRET, and an enabled billing module refuses startup with quickscale_billing.E001 naming them. From a clean tree, run `quickscale update --confirm-contract-adoption`, which updates the embedded modules through their configured branches, regenerates the managed wiring including the projected secrets, and records this step's adoption; an unflagged `quickscale update` or `quickscale apply` is refused while the adoption is pending. Run `quickscale apply` afterwards for any remaining desired-state changes."
      - "Keep the credential values in the deployment environment under the same `*_env_var` names; only the resolution path changes, so no secret value is copied into quickscale.yml or state."

  - id: sa226-org-role-back-offices
    minimum: "0.89.0"
    title: "Adopt the organization-role CRM workspace wording"
    adoption_steps:
      - "Compare and manually adopt the current showcase_react CrmPage.tsx copy and the CRM dashboard template: the workspace text and the dashboard link describe organization-role access (viewers read, members write) instead of a staff-only dashboard; Django admin remains staff-gated."
