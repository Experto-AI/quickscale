# Generated-project contract vintage declaration (SA207).
#
# Every change to a generated-project runtime contract is declared here once,
# with the manual adoption steps an existing project follows to catch up.
# Module manifests keep only module-specific boundaries; template contract
# changes live here.
#
# Each step's `id` is recorded in `.quickscale/state.yml`
# (`project.adopted_contract_steps`) when a project is generated or when its
# operator confirms adoption, so a project generated before the step existed
# cannot pass on a shared package version alone. `minimum` documents the
# QuickScale version that introduced the contract. `apply`, `update`, and
# `deploy railway` refuse while any declared step id is missing and name the
# outstanding steps; confirming adoption records every declared id and the
# highest declared minimum, so a caught-up project no longer needs the
# per-invocation acknowledgement flag. A changed contract gets a new step id.
#
# `scripts/check_project_contract_vintage.py` fails when a commit changes a
# template the generator emits into a generated project, a generator change
# alters the emitted file set, or a module manifest's `contract_vintage` step
# text changes without a new id. The watched template set derives from the
# generator's emission mapping, not a hand-listed path set. A new id must be
# unused by every other declaration: adopted ids share one namespace in
# applied state, so a colliding id would make an adopted project pass a
# different step.
steps:
  - id: sa192-shared-design
    minimum: "0.89.0"
    title: "Adopt the shared design across generated templates"
    adoption_steps:
      - "Compare and manually adopt the current templates/base.html, templates/index.html, and generated templates/social/*.html files so every DEBUG host loads the Vite-served /static/frontend/src/index.css, production loads frontend/assets/index.css, and the shell restores the persisted theme."
      - "Compare and manually adopt the current frontend/vite.config.ts static proxy and exact HTTP/WebSocket Host enforcement so Vite serves /static/frontend/ directly and accepts only the effective browser Host: configured QUICKSCALE_FRONTEND_ORIGIN, or localhost:QUICKSCALE_FRONTEND_HOST_PORT when blank."
      - "Compare and manually adopt the current <package>/settings/local.py QUICKSCALE_FRONTEND_HOST_PORT and validated QUICKSCALE_FRONTEND_ORIGIN settings so DEBUG React and module pages use the same browser-visible Vite stylesheet URL and malformed origins fail explicitly."
      - "Compare and manually adopt the current docker-compose.yml frontend workflow so it builds assets before starting Vite, publishes ${QUICKSCALE_FRONTEND_HOST_PORT:-5173}:5173, passes the port and optional full origin to Vite and Django, probes Vite with the effective Host, and waits for the Vite-served stylesheet."
      - "Run pnpm dev alongside Django for DEBUG module pages; run pnpm build so static/frontend/assets/index.css exists before serving non-DEBUG module pages."

  - id: sa200-proxy-trust
    minimum: "0.89.0"
    title: "Adopt the gated proxy-trust contract in production settings"
    adoption_steps:
      - "Compare and manually adopt the current settings/production.py proxy-trust contract: SECURE_PROXY_SSL_HEADER is set only while USE_X_FORWARDED_FOR is enabled, so a single-host deployment (USE_X_FORWARDED_FOR=False) never trusts a client-supplied X-Forwarded-Proto header for the HTTPS redirect or secure cookies."

  - id: sa201-throttling
    minimum: "0.89.0"
    title: "Adopt the composed DRF throttling contract"
    adoption_steps:
      - "Compare and manually adopt the current settings/base.py REST_FRAMEWORK block: it composes module-supplied DRF configuration instead of replacing it, installs AnonRateThrottle, UserRateThrottle, and ScopedRateThrottle as the default throttle classes, and merges the conservative anon/user defaults with module-contributed scopes such as billing's quickscale_billing_checkout and quickscale_billing_portal rates. A wholesale REST_FRAMEWORK assignment with no throttle classes silently drops the checkout-loop bound."

  - id: sa206-runtime-settings-facade
    minimum: "0.89.0"
    title: "Adopt the quickscale_core.runtime settings facade"
    adoption_steps:
      - "Compare and manually adopt the current settings/base.py and settings/production.py imports: generated settings import the client-identity and correlation-id middleware, the proxy-trust derivation, the privileged-command/runtime-database selection, and the SECRET_KEY guard from quickscale_core.runtime.settings, keeping only user configuration; remove any inline copy of those contracts and declare the bounded quickscale-core lockstep pin in pyproject.toml."

  - id: runtime-role-contract
    minimum: "0.89.0"
    title: "Adopt the canonical runtime-role provisioning contract"
    adoption_steps:
      - "Compare and manually adopt the current settings/production.py runtime-role contract and settings/base.py RUNTIME_DB_ROLE default."
      - "Compare and manually adopt the canonical quickscale_runtime role name and grants, including GRANT CONNECT, in db/init.sql and start.sh, plus the matching runtime-role URL in .env.example and docker-compose.yml; for an existing local database, run the role/grant SQL from OPERATIONS.md with <password> set to the password in the adopted local RUNTIME_DATABASE_URL, or reset the disposable Compose database volume before starting services; keep the migrate/createcachetable privileged-command set and unsupported-argv refusal unchanged."
      - "Compare and manually adopt the current Dockerfile startup contract and OPERATIONS.md runtime-role guidance."

  - id: compose-frontend-install-retries
    minimum: "0.89.0"
    title: "Adopt the resilient frontend dependency install"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml frontend service command so the pnpm install passes --config.fetch-retries=5: a single stalled registry request would otherwise abort the whole install and leave `quickscale up` with a failed-to-start frontend on constrained links."

  - id: sa218-drf-error-shape
    minimum: "0.89.0"
    title: "Adopt the one QuickScale DRF error shape"
    adoption_steps:
      - "Compare and manually adopt the current settings/base.py REST_FRAMEWORK block: it installs quickscale_core.runtime.conventions.exception_handler as EXCEPTION_HANDLER unless a module already contributed one, so every DRF-handled API error answers {\"error\": {\"code\", \"message\", \"fields\"}} with the HTTP status carrying the error class."
  - id: sa221-identity-stem
    minimum: "0.89.0"
    title: "Adopt the quickscale_<module> identities in generated files"
    adoption_steps:
      - "Compare and manually adopt the current generated admin templates and React admin links so app admin URLs use the quickscale_<module> app labels (for example /admin/quickscale_backups/...), and rename the tenant-isolation invocation in the generated Makefile and CI workflow to `quickscale_orgs_check_tenant_isolation`."
      - "Recreate the project database after adopting: module tables, content types, permissions, and AUTH_USER_MODEL moved to the quickscale_<module> stem, so a database created under the previous names cannot be carried over."
  - id: sa225-vendor-secret-compose-route
    minimum: "0.89.0"
    title: "Adopt the Compose backend vendor-credential route"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml backend environment list: it forwards STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY, QUICKSCALE_BILLING_WEBHOOK_SECRET, RESEND_API_KEY, QUICKSCALE_NOTIFICATIONS_WEBHOOK_SECRET, POSTHOG_API_KEY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, QUICKSCALE_BACKUPS_REMOTE_ACCESS_KEY_ID, and QUICKSCALE_BACKUPS_REMOTE_SECRET_ACCESS_KEY from the environment Compose sees, so a secret placed in the project's .env reaches the container and an enabled module's empty-secret startup check can pass."
  - id: sa225-vendor-secret-build-placeholders
    minimum: "0.89.0"
    title: "Superseded Dockerfile placeholder-credential step — adopt the skip-based contract instead"
    adoption_steps:
      - "Superseded: this step's placeholder-credential Dockerfile contract was replaced before adoption by the one-shot QUICKSCALE_SKIP_MODULE_CHECKS=all declared in the sa225-vendor-secret-route-generic step. Adopt that final contract; do not add placeholder credentials to the Dockerfile."
  - id: sa225-vendor-secret-route-generic
    minimum: "0.89.0"
    title: "Adopt the generic vendor-credential route and the build-time check skip"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml backend service: an env_file entry loads the project's .env into the container so a credential under any configured *_env_var name reaches it, while the explicit environment entries keep the default names available from a shell export and take precedence over env_file."
      - "Compare and manually adopt the current Dockerfile collectstatic step: it passes the one-shot QUICKSCALE_SKIP_MODULE_CHECKS=all instead of placeholder credentials, because an image build carries no runtime credentials and a configured credential name cannot be known statically; registration and every serving process keep the checks, and the launcher never sets the skip."
  - id: sa225-vendor-secret-skip-guard
    minimum: "0.89.0"
    title: "Adopt the container-side build-skip guard"
    adoption_steps:
      - "Compare and manually adopt the current docker-compose.yml backend environment: it clears QUICKSCALE_SKIP_MODULE_CHECKS explicitly so a build-skip value left in the project's .env (which env_file loads) can never reach a serving process, because environment entries take precedence over env_file."
  - id: sa225-generated-ci-test-credentials
    minimum: "0.89.0"
    title: "Adopt non-live vendor credentials in the generated CI workflow"
    adoption_steps:
      - "Compare and manually adopt the current .github/workflows/ci.yml job environment: when analytics, billing, or notifications is selected it defines non-live placeholder credentials (POSTHOG_API_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_SECRET_KEY, QUICKSCALE_BILLING_WEBHOOK_SECRET, RESEND_API_KEY, QUICKSCALE_NOTIFICATIONS_WEBHOOK_SECRET) so an enabled module's startup check passes in CI, which never calls the live vendors."
      - "A project that configured a custom *_env_var name adds that variable to the same job environment; the placeholders are test values only and do not belong in a serving environment."
  - id: sa217-settings-schema
    minimum: "0.89.0"
    title: "Adopt the managed settings schema import"
    adoption_steps:
      - "Add MODULE_SETTINGS_SCHEMA to the `from .modules import ...` statement in <package>/settings/base.py (or otherwise expose the managed schema to Django settings), and commit that edit: `quickscale update` refuses a dirty tree. Then run `quickscale update --confirm-contract-adoption`, which updates the embedded modules through their configured branch, regenerates settings/modules.py with the compiled schema every installed module's startup check validates against, and records the adoption. An unflagged update or apply is refused while the adoption is pending, and apply alone cannot regenerate the wiring while the embedded modules are still on an older version. Until both are in place a module refuses startup with quickscale_settings.E001."
      - "A project generated at this version or later already imports the schema; only an earlier project needs the manual edit."
  - id: sa223-theme-error-shape
    minimum: "0.89.0"
    title: "Adopt the one-shape API error parsing in the React theme client"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useApi.ts: getApiErrorMessage and getApiFieldErrors read the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}}, prefer the first field message as the actionable message, and no longer read the retired pre-convention {\"error\": \"<message>\"} and {\"errors\": {...}} shapes (see the `sa289-theme-one-error-parser` step for the current parser); without the update, a converted module API shows only a generic message or no field errors in an existing project."
      - "Optionally copy the new frontend/src/test/useApiErrors.test.ts to pin the parser behavior."
  - id: sa223-theme-error-shape-social
    minimum: "0.89.0"
    title: "Adopt one-shape error parsing in the theme's public social pages"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useApi.ts and frontend/src/hooks/usePublicSocialSurface.ts: getApiPayloadMessage reads the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}} from a raw payload, and the public social hook uses it so a non-managed error body shows its message instead of the generic contract-mismatch text."
      - "Optionally copy the current frontend/src/test/PublicSocialPages.test.tsx cases to pin the message and first-field-message behavior."
  - id: sa223-theme-error-shape-forms
    minimum: "0.89.0"
    title: "Adopt one-shape error handling in the theme's form client"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/components/forms/FormRenderer.tsx and frontend/src/hooks/useFormSchema.ts: the form client submits through the shared apiRequest client and renders the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}} — validation field errors under their fields, a field with no visible error outlet (hidden fields included, which never block submission locally) and non-field errors as a global message, and the shape's message for every other failure — and the schema hook surfaces the shape's message when the form schema cannot be fetched."
      - "Optionally copy the current frontend/src/test/FormRenderer.test.tsx cases to pin the field-error, non-field-error, shaped-message, and network-failure behavior."
  - id: sa223-orgs-url-mount
    minimum: "0.89.0"
    title: "Adopt the orgs module's /orgs/ mount and /orgs/api/ JSON API"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useOrgs.ts org API paths: the org JSON API moved from /api/orgs/... to /orgs/api/... — the org list/create endpoint is /orgs/api/ and org-scoped endpoints are /orgs/api/<slug>/... — so custom frontend code that calls /api/orgs/... updates its paths."
      - "Compare and manually adopt the current <package>/urls.py org React-shell routes: the /orgs/<slug>/ shell route excludes /orgs/api/ so the module's JSON API reaches Django instead of the shell, and the module's HTML routes (org dashboard, members, settings, invitation accept) stay at their existing /orgs/... URLs."
      - "Audit project-owned template overrides of the orgs templates (for example a copied templates/quickscale_orgs/members.html) for the retired global route names org-members-invite, org-members-invitation-revoke, and org-debug-exit, and rename them to their quickscale_orgs snake_case forms (quickscale_orgs:members_invite, quickscale_orgs:members_invitation_revoke, quickscale_orgs:debug_exit); the module's own templates already use the namespaced names."
  - id: sa223-billing-url-mount
    minimum: "0.89.0"
    title: "Adopt the billing module's /billing/ mount and /billing/api/ JSON API"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useOrgs.ts billing API path: the billing JSON API moved from /api/billing/... to /billing/api/... under the module's /billing/ mount, so custom frontend code that calls /api/billing/... updates its paths; the Stripe webhook stays at /billing/webhooks/stripe/, and the module's HTML routes (dashboard, pricing, purchase and subscription returns, portal return) keep their existing /billing/... URLs."
      - "Audit project-owned template overrides that reverse the retired kebab-case billing route names (billing-config, subscription-plans, credit-balance, credit-transactions, purchase-checkout, subscription-detail, subscription-checkout, subscription-cancel-current, billing-portal-session, billing-dashboard, pricing-page, purchase-success, purchase-cancel, subscription-success, subscription-cancel, portal-return, stripe-webhook) and rename them to their snake_case forms under quickscale_billing: (config, subscription_plans, credit_balance, credit_transactions, purchase_checkout, subscription_detail, subscription_checkout, subscription_cancel_current, portal_session, dashboard, pricing_page, purchase_success, purchase_cancel, subscription_success, subscription_cancel, portal_return, stripe_webhook)."
  - id: sa223-crm-forms-url-mount
    minimum: "0.89.0"
    title: "Adopt the crm and forms module mounts and their moved JSON APIs"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useOrgNavigation.ts, frontend/src/hooks/useFormSchema.ts, and frontend/src/components/forms/FormRenderer.tsx forms API paths: the forms JSON API moved from /api/forms/... to /forms/api/... under the module's /forms/ mount, and the staff admin API moved from /api/admin/forms/... to /forms/api/admin/forms/..., so custom frontend code that calls the retired paths updates them; the forms HTML pages keep their existing /forms/... URLs."
      - "Audit project-owned Django templates and Python code that reverse crm routes (a copied templates/quickscale_crm/*.html, or project code calling reverse('quickscale_crm:...')) for the retired kebab-case crm route names (api-root, tag-list, tag-detail, company-list, company-detail, contact-list, contact-detail, contact-notes, stage-list, stage-detail, deal-list, deal-detail, deal-notes, deal-bulk-update-stage, deal-mark-won, deal-mark-lost, contact-note-list, contact-note-detail, deal-note-list, deal-note-detail) and forms routes (form-list, form-page, form-schema, form-submit, admin-form-list, admin-submission-list, admin-submission-detail, admin-submission-export), and rename them to their snake_case forms under quickscale_crm: and quickscale_forms:. The crm HTML dashboard and JSON API keep their existing /crm/dashboard/ and /crm/api/... URLs."
      - "Audit project-owned Django templates and Python code that reverse the retired analytics-dashboard route name and rename it to quickscale_analytics:dashboard; the analytics page URL is unchanged at /analytics/."
  - id: sa219-orgs-mode-setting
    minimum: "0.89.0"
    title: "Adopt the QUICKSCALE_ORGS_MODE rename in project templates"
    adoption_steps:
      - "Compare and manually adopt the current <package>/context_processors.py: the billing dashboard URL reads the deployment mode from QUICKSCALE_ORGS_MODE instead of the retired QUICKSCALE_MODE, so a project still reading the old name sends a saas request to the solo billing path without any error."
      - "Compare and manually adopt the current templates/index.html: window.__QUICKSCALE__.owner.mode reads settings.QUICKSCALE_ORGS_MODE, so the React shell reports the deployment mode the settings actually declare."
      - "Remove QUICKSCALE_MODE from the project's settings and run `quickscale apply`: the orgs startup check refuses the retired name with the replacement named, and the managed settings/modules.py then carries QUICKSCALE_ORGS_MODE from the module's manifest."
  - id: sa219-module-enabled-flags
    minimum: "0.89.0"
    title: "Adopt per-module enabled awareness in the React module flags"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html: the blog, crm, forms, and listings entries in window.__QUICKSCALE__.modules are true only while the module is installed and its QUICKSCALE_<MODULE>_ENABLED setting is on, so a module switched off in quickscale.yml leaves the shell navigation instead of linking to URLs apply no longer mounts."
      - "Run `quickscale apply` for a project whose settings/modules.py predates the enabled option: the managed file then carries QUICKSCALE_<MODULE>_ENABLED for each of the four modules and its urls.py drops the mounts of any module switched off."
  - id: sa219-foundation-enabled-flags
    minimum: "0.89.0"
    title: "Adopt enabled awareness for the foundation modules and the remaining React flags"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html, templates/social/link_tree.html, templates/social/embeds.html, and templates/base.html: the auth, storage, backups, notifications, analytics, billing, and social entries in window.__QUICKSCALE__.modules are true only while the module is installed and its QUICKSCALE_<MODULE>_ENABLED setting is on (social no longer keys off its link-tree/embeds feature pair), both public social pages hydrate only while the social module is installed and enabled, and the shared navigation hides its Social and Embeds links in the same state, so a module switched off in quickscale.yml leaves the shell navigation instead of linking to URLs apply no longer mounts."
      - "Run `quickscale apply` for a project whose settings/modules.py predates the enabled option: the managed file then carries QUICKSCALE_AUTH_ENABLED, QUICKSCALE_BACKUPS_ENABLED, QUICKSCALE_ORGS_ENABLED, QUICKSCALE_SOCIAL_ENABLED, and QUICKSCALE_STORAGE_ENABLED, its urls.py drops the mounts of any switched-off module (auth's accounts/ mounts, orgs' orgs/ mount in either mode, social's managed /social mount), the backups scheduled create/prune runs refuse while off, and apply refuses to switch off a module another installed module requires."
  - id: sa217-schema-import-exposure
    minimum: "0.89.0"
    title: "Adopt the schema exposure annotation in the generated base settings"
    adoption_steps:
      - "Compare and manually adopt the current <package>/settings/base.py import of MODULE_SETTINGS_SCHEMA: annotate that name with `# noqa: F401` and a comment, as the generated file does, because Django exposes every uppercase global in the settings module and the generic startup check validates against settings.MODULE_SETTINGS_SCHEMA. Without the annotation the project's own ruff check reports the import as unused."
      - "A project generated at this version or later already carries the annotation; no other change is needed."
  - id: sa219-discovery-seam-producer
    minimum: "0.89.0"
    title: "Adopt the discovery-rendered React seam and its {% url %}-based module paths"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html: window.__QUICKSCALE__.modules carries a key for every shipped module (present as false when the module is absent) and its modulePaths entries reverse named routes with {% url %} instead of literal paths — crm through the crm-shell route, social through social-link-tree or social-embeds, and analytics through quickscale_analytics:dashboard. A project that keeps a literal path can link to a route apply no longer mounts."
      - "Compare and manually adopt the current <package>/urls.py: the /crm/ React shell route is named crm-shell so the seam's crm path reverses it; a project that moved that route updates the name instead of editing the seam."
  - id: sa235-module-shell-routes
    minimum: "0.89.0"
    title: "Adopt manifest-declared module React shell routes"
    adoption_steps:
      - "Compare and manually adopt the current <package>/views.py and <package>/urls.py: the React shell view `react_shell_view` now lives in views.py, urls.py imports it and imports SPA_MODULE_URLPATTERNS from <package>/urls_modules.py, and appends `urlpatterns += SPA_MODULE_URLPATTERNS` after `urlpatterns += POST_HOME_MODULE_URLPATTERNS`. The retired `^(profile|blog|listings|settings)/?$` and `^crm/?$` (named crm-shell) reservations are gone, so /blog/ and /listings/ serve the module indexes; forms keeps its host reservations because its module entrypoint renders only a mount-point div. This supersedes the sa219-discovery-seam-producer step's crm-shell guidance."
      - "Run `quickscale apply` after updating the embedded modules: it regenerates <package>/urls_modules.py from each installed and enabled module's manifest-declared spa_routes, so the CRM shell route reverses as quickscale_crm_shell and a switched-off module contributes no shell route. A project that keeps importing react_shell_view from urls.py or lacks the SPA list fails to import its URLconf after the embedded-module update."
      - "Compare and manually adopt the current templates/index.html, templates/base.html, and templates/social/*.html: the two public social pages render the shared seam (flags and {% url %}-based modulePaths) through the `quickscale_seam` runtime template tag, the shared navigation reads the module's projected QUICKSCALE_SOCIAL_* path settings, and the CRM modulePaths entry reverses quickscale_crm_shell."
  - id: sa235-context-processor-billing-urls
    minimum: "0.89.0"
    title: "Adopt route-name billing URLs in the generated context processor"
    adoption_steps:
      - "Compare and manually adopt the current <package>/context_processors.py: `modules.billing.url` reverses `quickscale_billing:pricing_page` for anonymous visitors and `quickscale_billing:dashboard` for authenticated ones instead of repeating `/billing/...` path strings, in both deployment modes, and the retired organization-scoped `/orgs/<slug>/billing/pricing/` value is gone because no organization-scoped billing URL tree exists. The projected `QUICKSCALE_BILLING_ENABLED` setting gates the value, so while billing is absent or switched off it is `None` and a template that links the value guards it with `{% if modules.billing.url %}`. This step supersedes the `sa219-orgs-mode-setting` step's context-processor guidance, which described the retired mode-dependent URL: adopt the route-name behavior for that file while keeping that step's `templates/index.html` and settings edits."
  - id: sa219-billing-projected-secrets
    minimum: "0.89.0"
    title: "Adopt the projected Stripe secret settings billing reads at runtime"
    adoption_steps:
      - "Update the embedded billing module to this release before applying: `quickscale apply` renders settings/modules.py from the embedded module's adapter, so an apply against a project whose `modules/billing` predates this release still writes no QUICKSCALE_BILLING_PUBLISHABLE_KEY, QUICKSCALE_BILLING_SECRET_KEY, or QUICKSCALE_BILLING_WEBHOOK_SECRET, and an enabled billing module refuses startup with quickscale_settings.E002 from the generic settings check naming the missing projected settings. From a clean tree, run `quickscale update --confirm-contract-adoption`, which updates the embedded modules through their configured branches, regenerates the managed wiring including the projected secrets, and records this step's adoption; an unflagged `quickscale update` or `quickscale apply` is refused while the adoption is pending. Run `quickscale apply` afterwards for any remaining desired-state changes."
      - "Keep the credential values in the deployment environment under the same `*_env_var` names; only the resolution path changes, so no secret value is copied into quickscale.yml or state."

  - id: sa226-org-role-back-offices
    minimum: "0.89.0"
    title: "Adopt the organization-role CRM workspace wording"
    adoption_steps:
      - "Compare and manually adopt the current showcase_react CrmPage.tsx copy and the CRM dashboard template: the workspace text and the dashboard link describe organization-role access (viewers read, members write) instead of a staff-only dashboard; Django admin remains staff-gated."

  - id: sa214-design-layer
    minimum: "0.89.0"
    title: "Adopt the project-owned design layer"
    adoption_steps:
      - "Create project-owned frontend/design/ holding the current design source: tokens.css with the current frontend/src/index.css content (the Tailwind directives plus the :root/.dark custom properties), tailwind.preset.js with the current frontend/tailwind.config.js darkMode, theme, and plugins, plus fonts/ and brand/ for project-owned webfonts and brand assets."
      - "Reduce frontend/src/index.css to `@import \"../design/tokens.css\";` and frontend/tailwind.config.js to a config whose presets consume ./design/tailwind.preset.js while its content globs stay in the entry config. The Django-rendered shell and the React host then resolve one token source, and frontend/design/ is never overwritten by a later upgrade or apply."
      - "Preserve every relative reference while moving the design: rebase CSS `url()` and `@import` targets that were relative to frontend/src/ to the equivalent `../src/...` path (or move the referenced files into frontend/design/), and rebase relative JavaScript module specifiers in the Tailwind config the same way. Tailwind `content` globs resolve against the frontend working directory, so never rebase them. The maintainer migration blocks and names any reference it cannot preserve rather than silently dropping a design resource."
      - "Make future color, radius, font, and brand changes in frontend/design/ (tokens.css, the preset, fonts/, brand/) instead of frontend/src/index.css or frontend/tailwind.config.js."

  - id: sa251-billing-async-payment-events
    minimum: "0.89.0"
    title: "Adopt the billing async-payment webhook events"
    adoption_steps:
      - "Compare the current OPERATIONS.md Stripe Billing section and subscribe the project's Stripe webhook endpoint to `checkout.session.async_payment_succeeded` and `checkout.session.async_payment_failed` alongside the events it already receives. A delayed-notification payment method (SEPA, ACH, Bacs, bank transfer) completes its one-time Checkout before the money settles, so without both events the purchase is charged but never credited, and a failed payment keeps blocking account deletion and organization purge."
  - id: sa266-command-flags
    minimum: "0.89.0"
    title: "Adopt the tenant-isolation command's --json flag"
    adoption_steps:
      - "Compare and manually adopt the current Makefile check-tenant-isolation target and .github/workflows/ci.yml isolation step: both invoke `quickscale_orgs_check_tenant_isolation --postgres-only --json`, because the command's machine output flag is `--json` and `--format json` is no longer accepted."
  - id: sa258-runtime-seam-tag
    minimum: "0.89.0"
    title: "Adopt the runtime React seam template tag"
    adoption_steps:
      - "Compare and manually adopt the current templates/index.html and templates/social/*.html: the `window.__QUICKSCALE__.modules` and `modulePaths` bodies render through the `quickscale_seam` runtime template tag (`{% load static quickscale_seam %}` with `{% seam_module_flags %}` and `{% seam_module_paths %}`) instead of the generation-time module lines, so the module flags and paths follow the installed modules without editing those user-owned files again. A project that keeps the generated lines still renders; adopting the runtime seam is what ends the per-module edit. This supersedes the `sa235-module-shell-routes` step's earlier `generator/seam.py` description of how those pages render the seam."
      - "Compare and manually adopt the current <package>/settings/base.py TEMPLATES options: add the `\"libraries\"` entry mapping `\"quickscale_seam\"` to `\"quickscale_core.runtime.seam_tags\"` so `{% load quickscale_seam %}` resolves; without it the adopted templates fail with a TemplateSyntaxError at render time."

  - id: sa258-runtime-drf-composition
    minimum: "0.89.0"
    title: "Adopt the runtime DRF composition"
    adoption_steps:
      - 'Compare and manually adopt the current <package>/settings/base.py: replace the inline REST_FRAMEWORK block (the EXCEPTION_HANDLER, DEFAULT_PERMISSION_CLASSES, DEFAULT_THROTTLE_CLASSES, and DEFAULT_THROTTLE_RATES defaults, plus the NUM_PROXIES derivation) with one `REST_FRAMEWORK = compose_rest_framework(globals().get("REST_FRAMEWORK"), use_x_forwarded_for=USE_X_FORWARDED_FOR, trusted_proxy_count=TRUSTED_PROXY_COUNT)` call, importing compose_rest_framework from quickscale_core.runtime.settings and dropping the now-unused num_proxies_for import from base.py (production.py keeps its own num_proxies_for recompute after the production proxy overrides). The helper keeps the merge behavior: a module-contributed DRF key or throttle rate still wins, and only keys a module left unset fall back to the fail-closed defaults. This supersedes the DRF guidance in the `sa201-throttling` and `sa218-drf-error-shape` steps, which describe the inline block the runtime call replaces; adopt those steps behaviorally through this one.'

  - id: sa258-managed-urlconf
    minimum: "0.89.0"
    title: "Adopt the managed URLconf and the runtime template-URL context"
    adoption_steps:
      - 'Compare and manually adopt the current <package>/urls.py: replace the module URL bucket imports (PRE_HOME_MODULE_URLPATTERNS, POST_HOME_MODULE_URLPATTERNS, and SPA_MODULE_URLPATTERNS) and their `urlpatterns +=` lines, plus the `react_shell_urlpatterns` block and the public social page routes, with one `path("", include("<package>.urls_modules"))` entry after the admin route. The shell reservations, the public social pages, the module URL includes, and the manifest-declared React shell routes now render from the managed URLconf, so the user-owned file names no module. This supersedes the `sa235-module-shell-routes` step guidance for <package>/urls.py; adopt that step behaviorally through this one.'
      - 'Compare and manually adopt the current <package>/context_processors.py: `installed_modules` returns `{"modules": installed_module_context(request)}` from quickscale_core.runtime.urls instead of reversing a module route inline. The module URL table and its anonymous/authenticated route selection moved to the versioned runtime library; the context key and value shape are unchanged. This supersedes the `sa235-context-processor-billing-urls` step guidance for that file.'
      - 'Run `quickscale update --confirm-contract-adoption` from a clean tree after the two edits (or `quickscale apply` once the step is recorded): it regenerates <package>/urls_modules.py as the managed URLconf that composes the theme shell routes and the module includes through quickscale_core.runtime.urls.compose_managed_urlpatterns. A project that keeps the old urls.py shape still imports, because the three buckets stay exported, but it does not receive the runtime shell-route contract.'

  - id: sa262-social-resolution-marker
    minimum: "0.89.0"
    title: "Adopt the stable public social-embed resolution marker"
    adoption_steps:
      - 'Compare and manually adopt the managed /social/embeds payload contract: a published embed whose stored resolution failed now carries the stable message "Embed metadata could not be resolved." in `resolution_error` instead of the stored resolver error text, and the raw message stays on the embed row and in the Django admin. Project code or fixtures that asserted the raw text switch to the marker or to `resolution_status`.'
      - 'Optionally copy the current frontend/src/test/PublicSocialPages.test.tsx embeds fixture and assertion to pin the marker behavior.'

  - id: sa253-generated-automation
    minimum: "0.89.0"
    title: "Adopt the generated automation that passes as rendered"
    adoption_steps:
      - "Compare and manually adopt the current .github/workflows/ci.yml: every action is pinned by commit SHA with its version comment, the workflow declares a top-level `permissions: contents: read`, the test step sets `DATABASE_URL` for the CI service database, and the migrate and tenant-isolation steps run under `<package>.settings.local`."
      - "Compare and manually adopt the current Dockerfile: the `HEALTHCHECK` probes `/healthcheck/` over loopback while presenting the always-admitted `healthcheck.railway.app` Host and counts only a 2xx answer as healthy, and the frontend stage requires the committed `frontend/pnpm-lock.yaml` and installs with `--frozen-lockfile`."
      - "Generate and commit the missing `frontend/pnpm-lock.yaml` with `pnpm install --lockfile-only` (or `pnpm install`), then rebuild the image so the frozen install runs against it."
      - "Compare and manually adopt the current coverage and test files: `pyproject.toml` omits `*/settings/*` from coverage, `urls.py` marks its dev-only DEBUG branch no-cover, `tests/test_example.py` covers the healthcheck, shell route, entry points, and error handlers, and `frontend/vitest.config.ts` collects only src test files so the Playwright specs under `frontend/e2e/` stay with Playwright."
      - "Compare and manually adopt the current `<package>/views.py`, `<package>/context_processors.py`, and `<package>/urls_modules.py` import blocks (the generated project's Ruff configuration groups `quickscale_core` with third-party imports), so the rendered CI's `ruff format --check` and `ruff check` steps pass on a fresh checkout."

  - id: sa253-frontend-coverage
    minimum: "0.89.0"
    title: "Adopt the starter frontend test suite that meets the coverage gate"
    adoption_steps:
      - 'Compare and optionally copy the current frontend/src/test additions (AppRoutes.test.tsx, analytics.test.ts, formFields.test.tsx, layoutComponents.test.tsx, orgComponents.test.tsx, orgListPage.test.tsx, settingsPage.test.tsx, socialLinkTreeStates.test.tsx, themeStore.test.ts, uiPrimitives.test.tsx, useModules.test.tsx, useOrgNavigation.test.tsx, useOrgs.test.tsx) so the project''s own `pnpm test:coverage` meets its existing per-file thresholds; the suite is project-owned after generation.'
      - 'If project code copied the starter frontend/src/lib/analytics.ts, adopt its `import.meta.env` read in the literal-token form so test-environment stubs apply; runtime behavior is unchanged.'

  - id: sa261-seam-module-api-paths
    minimum: "0.89.0"
    title: "Adopt the seam's module API bases and the one shared editor mount"
    adoption_steps:
      - 'Compare and manually adopt the current templates/index.html and templates/social/*.html together with frontend/src/lib/validateQuickScaleSeam.ts, frontend/src/hooks/useModules.ts, and the API-calling hooks and components (useOrgs.ts, useOrgNavigation.ts, useFormSchema.ts, forms/FormRenderer.tsx): the seam now carries `moduleApiPaths`, each API-bearing module''s base resolved from its URL names at the `<mount>api/` boundary, and the validator requires the key, so a project that adopts only one side fails at page load. Rebuild the frontend (`pnpm build`) after adopting the theme sources.'
      - 'Re-apply the project (`quickscale apply`) or manually adopt the one shared editor mount: storage mounts the staff-guarded `markdownx/` URLconf and writes `MARKDOWNX_MARKDOWN_EXTENSIONS` and `MARKDOWNX_MEDIA_PATH = "markdownx/"`, blog and listings no longer mount or configure the endpoints, and listings requires storage, so a listings installation selects it. New editor uploads land under `markdownx/`; files already stored keep their recorded paths. This supersedes the per-module Markdownx include and the `MARKDOWNX_MEDIA_PATH = "blog/markdownx/"` guidance in the older module READMEs.'
  - id: sa261-theme-seam-test-fixtures
    minimum: "0.89.0"
    title: "Adopt the theme test suite's seam fixtures"
    adoption_steps:
      - 'The theme''s own Vitest fixtures construct `window.__QUICKSCALE__` with the `moduleApiPaths` key the seam validator requires (the orgs, billing, crm, and forms bases), so a project that copies the starter tests runs them against the same seam contract. Test-only: no project file changes beyond the `sa261-seam-module-api-paths` step.'

  - id: sa272-generated-ci-notifications-secret
    minimum: "0.89.0"
    title: "Adopt a decodable notifications webhook secret in the generated CI workflow"
    adoption_steps:
      - "Compare and manually adopt the current .github/workflows/ci.yml job environment: replace the notifications signing-secret placeholder (`whsec_test_ci`) with a `whsec_`-prefixed value whose remainder is valid base64 (for example `whsec_YWFhYWFhYWFhYWFhYWFhYQ==`), because the notifications module's startup check now refuses a malformed signing secret and would fail the workflow's pytest and migrate steps. A project that renamed the variable through `webhook_secret_env_var` updates that name instead."

  - id: sa276-managed-seam-types
    minimum: "0.89.0"
    title: "Adopt the managed theme seam declaration"
    adoption_steps:
      - "From a clean tree, run `quickscale apply --confirm-contract-adoption`: the confirmed command regenerates the managed theme seam files (frontend/src/quickscaleSeam.d.ts, the theme's seam types, and frontend/src/quickscaleSeam.keys.ts, its key manifest) from the shipped module set and records this step's adoption, so the theme's seam types and the validator's required keys arrive without a hand edit. A project with embedded modules can run `quickscale update --confirm-contract-adoption` instead; a project with none cannot, because `update` has nothing to pull. The files are hash-tracked, so a local edit is reported as managed-file drift and is overwritten by the next apply that regenerates the managed files — `quickscale apply --confirm-contract-adoption` again when the configuration has no changes (a plain no-delta apply reports nothing to do instead). Rebuild the frontend (`pnpm build`) after adopting."

  - id: sa276-theme-seam-consumers
    minimum: "0.89.0"
    title: "Adopt the theme's declaration-consuming hooks and validator"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useModules.ts, frontend/src/lib/validateQuickScaleSeam.ts, and their tests: the hook imports the seam's type tables (QuickScaleModules, QuickScaleModulePaths, QuickScaleModuleApiPaths) from the managed frontend/src/quickscaleSeam.d.ts and reads the producer-resolved owner slug instead of inferring one from the crm module path, and the validator requires every key of the managed frontend/src/quickscaleSeam.keys.ts manifest — an own boolean per module flag, a non-empty string per path and API base — instead of holding its own module-key list, with the theme's tests building their seam fixtures from the generated key manifest. Adopting the current files satisfies the `sa261-seam-module-api-paths` step's comparison for these two files; the managed seam files themselves arrive through the `sa276-managed-seam-types` step. Rebuild the frontend (`pnpm build`) after adopting."

  - id: sa276-seam-manifest-rendering
    minimum: "0.89.0"
    title: "Adopt the theme seam key manifest's rendered bytes"
    adoption_steps:
      - "The managed frontend/src/quickscaleSeam.keys.ts that the `sa276-managed-seam-types` step lists is emitted byte-identical to the runtime renderer (`quickscale_core.runtime.seam.render_seam_key_manifest`), including its template's whitespace control, so generation and `quickscale apply`/`quickscale update` agree on one content; a project that generated the file before this fix re-runs `quickscale apply --confirm-contract-adoption` to rewrite it."

  - id: sa274-crm-theme-stats
    minimum: "0.89.0"
    title: "Adopt the CRM stats endpoint in the theme's CRM workspace"
    adoption_steps:
      - "Compare and manually adopt the current showcase_react CrmPage.tsx: the workspace's stat cards read the organization totals from the CRM module's `crm/api/stats/` endpoint (`{\"contacts\", \"companies\", \"deals\", \"tags\"}`) instead of inferring a count from the first bare-list page, which always showed 0. From a clean tree, run `quickscale update --confirm-contract-adoption`: it updates the embedded CRM module to this release — an embedded module from an earlier release serves no stats route, so the cards would show no total — and records this step's adoption, while an unflagged `quickscale update` or `quickscale apply` is refused while the adoption is pending; a project with no embedded modules runs `quickscale apply --confirm-contract-adoption` instead, because `update` has nothing to pull. Rebuild the frontend (`pnpm build`) after adopting."

  - id: sa280-operations-stripe-version
    minimum: "0.89.0"
    title: "Adopt the operations guide's rendered Stripe API version"
    adoption_steps:
      - "Compare and manually adopt the current OPERATIONS.md Stripe Billing section: the required webhook endpoint version now renders from the billing module's one authored constant instead of a hand-copied literal, so the guide names the current version after any future Stripe pin bump without a template edit; the rendered text is unchanged at this release."

  - id: sa289-theme-one-error-parser
    minimum: "0.89.0"
    title: "Adopt the theme's one-shape API error parser"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useApi.ts and frontend/src/test/useApiErrors.test.ts: the parser reads only the one QuickScale shape {\"error\": {\"code\", \"message\", \"fields\"}} — the first field message as the actionable message, the shape's message otherwise — and the retired pre-convention {\"error\": \"<message>\"} and {\"errors\": {...}} shapes are deliberately unparsed, so a body that carries only them shows the status fallback and no field errors instead of a stale message. Adopting the current useApi.ts satisfies the `sa223-theme-error-shape` step's comparison for the parser. Rebuild the frontend (`pnpm build`) after adopting."

  - id: sa289-theme-request-client-and-seam-paths
    minimum: "0.89.0"
    title: "Adopt the theme's one request client and its seam-backed module page paths"
    adoption_steps:
      - "From a clean tree, run `quickscale apply --confirm-contract-adoption` (or `quickscale update --confirm-contract-adoption` when the project embeds modules): the confirmed command regenerates the managed theme seam files, frontend/src/quickscaleSeam.d.ts and frontend/src/quickscaleSeam.keys.ts, whose `modulePaths` table now also carries `blog` and `listings` and which gains the `moduleDocumentPaths` table, and records this step's adoption; a project with no embedded modules cannot run `update`, because it has nothing to pull, so `apply` is its route. A plain no-delta apply reports nothing to do instead."
      - "Compare and manually adopt the current frontend/src/hooks/useModules.ts (its QuickScaleConfig carries moduleDocumentPaths), frontend/src/lib/validateQuickScaleSeam.ts (it requires the regenerated key manifest's document-path keys), frontend/src/hooks/useOrgNavigation.ts, frontend/src/hooks/useFormSchema.ts, frontend/src/hooks/usePublicSocialSurface.ts, frontend/src/App.tsx, frontend/src/pages/Dashboard.tsx (its module cards take their links from the seam), and frontend/eslint.config.js, plus the current templates/index.html, templates/social/link_tree.html, and templates/social/embeds.html, which render the new `moduleDocumentPaths` object through the `seam_module_document_paths` tag: every theme request goes through the shared `apiRequest` client (which owns CSRF, the JSON contract, and the one QuickScale error shape, so a failed request shows that shape's message or the status fallback), the SPA's module page routes and navigation paths for blog, listings, and crm read `window.__QUICKSCALE__.modulePaths`, the launcher pages' document links read `window.__QUICKSCALE__.moduleDocumentPaths`, both instead of hard-coded paths, and an ESLint rule rejects a raw `fetch(` in `src/hooks` outside `useApi.ts`. A project that keeps the starter frontend tests also adopts the current frontend/src/test/seamFixtures.ts and the updated test files, which build their seam fixtures from the generated key manifest. Adopt the theme files, the three templates, and the regenerated managed seam files together: the module paths exist only once all sides are current, because an older useModules.ts has no moduleDocumentPaths member and older templates render no moduleDocumentPaths object. Rebuild the frontend (`pnpm build`) after adopting."

  - id: sa286-managed-ci-environment
    minimum: "0.89.0"
    title: "Adopt the managed CI environment file and its single load step"
    adoption_steps:
      - "Compare and manually adopt the current .github/workflows/ci.yml: the module credential env block is replaced by one load step (`run: cat .github/quickscale-ci-env >> \"$GITHUB_ENV\"`), so the user-owned workflow names no module value and a later module release changes no user-owned file. This supersedes the `sa225-generated-ci-test-credentials` and `sa272-generated-ci-notifications-secret` steps' ci.yml guidance, which describe the env block this step replaces; adopt them behaviorally through this one."
      - "Run `quickscale update --confirm-contract-adoption` from a clean tree once this release's embedded modules are available: it updates the embedded modules, regenerates the managed .github/quickscale-ci-env file from each installed module's declared CI placeholders (honoring a renamed *_env_var option), and records this step's adoption; a project with no embedded modules runs `quickscale apply --confirm-contract-adoption` instead, because `update` has nothing to pull. A project using a custom *_env_var name no longer adds it to the workflow by hand — the managed file carries the configured name."

  - id: sa286-managed-operations-page
    minimum: "0.89.0"
    title: "Adopt the managed operations page and its single link"
    adoption_steps:
      - "Compare and manually adopt the current OPERATIONS.md: the inline Stripe Billing section is replaced by one link to the managed quickscale-operations.md page (Markdown has no include directive), so the user-owned guide names no module value and a later module release changes no user-owned file. This supersedes the `sa280-operations-stripe-version` and `sa251-billing-async-payment-events` steps' OPERATIONS.md guidance, which describe the inline section this step replaces; adopt them behaviorally through this one."
      - "Run `quickscale update --confirm-contract-adoption` from a clean tree once this release's embedded modules are available: it updates the embedded modules, regenerates the managed quickscale-operations.md page from each installed module's declared operations text (resolving the module's configured options, so a renamed *_env_var follows the project's configuration), and records this step's adoption; a project with no embedded modules runs `quickscale apply --confirm-contract-adoption` instead, because `update` has nothing to pull. The page regenerates under the managed-file hash guard: a local edit is reported as drift and replaced on the next regeneration."

  - id: sa291-declared-throttle-scopes
    minimum: "0.89.0"
    title: "Adopt the manifest-declared throttle scopes in the composed REST_FRAMEWORK"
    adoption_steps:
      - "Compare and manually adopt the current <package>/settings/modules.py and <package>/settings/base.py: the managed wiring now carries each installed module's DRF throttle scopes in `MODULE_THROTTLE_SCOPES` instead of contributing `REST_FRAMEWORK[\"DEFAULT_THROTTLE_RATES\"]` through `MODULE_SETTINGS`, and the base settings import that map and pass it to `compose_rest_framework(..., throttle_scopes=MODULE_THROTTLE_SCOPES, ...)`. Run `quickscale update --confirm-contract-adoption` from a clean tree once this release's embedded modules are available (a project with no embedded modules runs `quickscale apply --confirm-contract-adoption` instead, because `update` has nothing to pull): it regenerates the managed modules.py and records this step, and the base.py import and call are adopted by hand. Until then a module view that attaches its throttle by `throttle_scope` fails loudly — DRF raises \"No default throttle rate set for '<scope>' scope\" on the first request — rather than serving unthrottled, and a project-set `REST_FRAMEWORK` keeps winning over the declared scopes after adoption."

  - id: sa153e3-public-page-prerender-reverted
    minimum: "0.89.0"
    title: "Adopt the social-only publicPage seam after the prerender reversion"
    adoption_steps:
      - "Compare and manually adopt the current frontend/src/hooks/useModules.ts, frontend/src/lib/validateQuickScaleSeam.ts, frontend/src/renderQuickScaleRoot.tsx, and frontend/src/main.tsx: the `window.__QUICKSCALE__.publicPage` seam carries the public social shapes only, `main.tsx` mounts the app tree with `createRoot` and seeds no query cache, and `renderQuickScaleRoot.tsx` renders the ordinary SPA through `BrowserRouter` with no static-location option while the public social pages keep their router-free dispatch. The prerendered properties variant never shipped on a published release — its `sa153e1-properties-public-page` step was retired before 0.89.0 — so a project on a published release has nothing to revert; a project that generated or adopted from the unpublished 0.89.0 development line restores those four files to the current shapes and serves its crawlable public pages per decisions.md § Frontend Rendering Decisions, Decision 2 (Django fills the SPA document's head and a crawler summary per request). A project that keeps the starter frontend tests also adopts the current frontend/src/test/validateQuickScaleSeam.test.ts and frontend/src/test/RootDispatch.test.tsx. Rebuild the frontend (`pnpm build`) after adopting."
