# Listings Module Manifest
# Defines configuration options and their mutability for the listings module

name: listings
version: "0.73.0"
description: "Generic listings module for marketplace-style products"

config:
  mutable:
    listings_per_page:
      type: integer
      default: 12
      django_setting: LISTINGS_PER_PAGE
      description: "Number of listings per page"

dependencies:
  - django-filter>=25.0
  - django-markdownx>=4.0
  - Pillow>=12.1.1,<13.0.0

django_apps:
  - django_filters
  - markdownx
  - quickscale_modules_listings

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - django_filters
          - markdownx
          - quickscale_modules_listings
      description: "Listings Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - listings/
            - quickscale_modules_listings.urls
          - - markdownx/
            - markdownx.urls
      description: "Listings URL includes"

  option_derivations:
    listings_per_page:
      derived_settings:
        - setting_key: LISTINGS_PER_PAGE
          source_options: [listings_per_page]
          derivation_type: direct
          expression:
            option: listings_per_page
          default: 12
          description: "Number of listings per page"
