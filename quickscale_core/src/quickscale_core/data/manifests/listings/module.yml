# Listings Module Manifest
# Defines configuration options and their mutability for the listings module

name: listings
version: "0.89.0"
description: "Generic listings module for marketplace-style products"

config:
  mutable:
    per_page:
      type: integer
      default: 12
      django_setting: QUICKSCALE_LISTINGS_PER_PAGE
      description: "Number of listings per page"
      validation:
        min: 1

  immutable: {}

required_modules:
  - orgs

dependencies:
  - djangorestframework>=3.17.2
  - django-filter>=26.1
  - django-markdownx>=4.0.11
  - Pillow>=12.3.0,<13.0.0

# Retired option keys are refused by name with the message declared here.
retired_options:
  listings_per_page: >-
    Legacy config key 'listings_per_page' is no longer supported. Use
    'per_page' instead.

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - markdownx
          - quickscale_modules_listings
      description: "Listings Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - listings/
            - quickscale_modules_listings.urls
          - - markdownx/
            - markdownx.urls
      description: "Listings URL includes"

  option_derivations:
    per_page:
      normalization_rules:
        - source_key: per_page
          target_key: per_page
          rule_type: strip
          description: "Strip whitespace from per_page"
