# Listings Module Manifest
# Defines configuration options and their mutability for the listings module

name: listings
version: "0.89.0"
description: "Generic listings module for marketplace-style products"

config:
  mutable:
    listings_per_page:
      type: integer
      default: 12
      django_setting: LISTINGS_PER_PAGE
      description: "Number of listings per page"

required_modules:
  - orgs>=0.86.0

dependencies:
  - django-filter>=26.1
  - django-markdownx>=4.0.11
  - Pillow>=12.3.0,<13.0.0

implies:
  - name: orgs

contract_vintage:
  minimum: "0.89.0"
  manual_adoption_steps:
    - "Compare and manually adopt the current templates/base.html, templates/index.html, and generated templates/social/*.html files so every DEBUG host loads the Vite-served /static/frontend/src/index.css, production loads frontend/assets/index.css, and the shell restores the persisted theme."
    - "Compare and manually adopt the current frontend/vite.config.ts static proxy rule so Vite serves /static/frontend/ directly instead of forwarding that path to Django."
    - "Compare and manually adopt the current <package>/settings/local.py QUICKSCALE_FRONTEND_HOST_PORT and QUICKSCALE_FRONTEND_ORIGIN settings so DEBUG React and module pages use the same browser-visible Vite stylesheet URL."
    - "Compare and manually adopt the current docker-compose.yml frontend workflow so it builds assets before starting Vite, publishes ${QUICKSCALE_FRONTEND_HOST_PORT:-5173}:5173, passes the port and optional full origin to Django, and waits for the Vite-served stylesheet."
    - "Run pnpm dev alongside Django for DEBUG module pages; run pnpm build so static/frontend/assets/index.css exists before serving non-DEBUG module pages."

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - django_filters
          - markdownx
          - quickscale_modules_listings
      description: "Listings Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - listings/
            - quickscale_modules_listings.urls
          - - markdownx/
            - markdownx.urls
      description: "Listings URL includes"

  option_derivations:
    listings_per_page:
      normalization_rules:
        - source_key: listings_per_page
          target_key: listings_per_page
          rule_type: strip
          description: "Strip whitespace from listings_per_page"
      validation_rules:
        - option_key: listings_per_page
          rule_type: pattern
          pattern: ^\d+$
          description: "modules.listings.listings_per_page must be a positive integer"
      derived_settings:
        - setting_key: LISTINGS_PER_PAGE
          source_options: [listings_per_page]
          derivation_type: direct
          expression:
            option: listings_per_page
          default: 12
          description: "Number of listings per page"
