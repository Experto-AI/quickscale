# Forms Module Manifest
# Defines configuration options and their mutability for the Forms module
# See decisions.md §Module Manifest Architecture for schema specification

name: forms
version: "0.89.0"
description: "Generic, customizable form builder module with admin management and React frontend renderer."

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    submissions_per_page:
      type: integer
      default: 25
      django_setting: QUICKSCALE_FORMS_SUBMISSIONS_PER_PAGE
      description: "Number of submissions shown per page in admin."
      validation:
        min: 1

    spam_protection_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_FORMS_SPAM_PROTECTION_ENABLED
      description: "Enable honeypot spam protection globally for forms that also keep their per-form flag enabled."
      validation: {}

    rate_limit:
      type: string
      default: "5/hour"
      django_setting: QUICKSCALE_FORMS_RATE_LIMIT
      description: "Throttle rate for form submissions (per IP). Format: '<count>/<period>'."
      validation:
        pattern: ^\d+/(second|minute|hour|day)$

    retention_days:
      type: integer
      default: 365
      django_setting: QUICKSCALE_FORMS_RETENTION_DAYS
      description: "Default days assigned to newly created forms before anonymization (0 = keep forever); existing forms keep their stored value."
      validation:
        min: 0

    api_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_FORMS_API_ENABLED
      description: "Enable REST API endpoints for admin submission management."
      validation: {}

  # Immutable options - locked at embed time, require remove + re-embed to change
  immutable: {}

required_modules:
  - notifications

# Dependencies required by this module
dependencies:
  - djangorestframework>=3.17.2
  - django-filter>=26.1

# Retired option keys are refused by name with the message declared here.
retired_options:
  forms_per_page: >-
    Legacy config key 'forms_per_page' is no longer supported. Use
    'submissions_per_page' instead.
  data_retention_days: >-
    Legacy config key 'data_retention_days' is no longer supported. Use
    'retention_days' instead.
  submissions_api_enabled: >-
    Legacy config key 'submissions_api_enabled' is no longer supported. Use
    'api_enabled' instead.

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - quickscale_modules_forms
      description: "Forms Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - forms/
            - quickscale_modules_forms.urls
      description: "Forms URL includes"

  option_derivations:
    rate_limit:
      normalization_rules:
        - source_key: rate_limit
          target_key: rate_limit
          rule_type: strip
          description: "Strip whitespace from rate_limit"
