# CRM Module Manifest
# Defines configuration options and their mutability for the CRM module
# See decisions.md §Module Manifest Architecture for schema specification

name: crm
version: "0.89.0"
description: "Lightweight CRM module with contacts, companies, deals, and pipeline management"

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    api_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_CRM_API_ENABLED
      description: "Enable REST API endpoints at /crm/api/"
      validation: {}

    deals_per_page:
      type: integer
      default: 25
      django_setting: QUICKSCALE_CRM_DEALS_PER_PAGE
      description: "Number of deals per page in list views"
      validation:
        min: 1

    contacts_per_page:
      type: integer
      default: 50
      django_setting: QUICKSCALE_CRM_CONTACTS_PER_PAGE
      description: "Number of contacts per page in list views"
      validation:
        min: 1

  immutable: {}

required_modules:
  - orgs

# Dependencies required by this module
dependencies:
  - djangorestframework>=3.17.2
  - django-filter>=26.1

# Retired option keys are refused by name with the message declared here.
retired_options:
  default_pipeline_stages: >-
    Legacy config key 'default_pipeline_stages' is no longer supported. Remove
    it from the CRM module options.
  enable_api: >-
    Legacy config key 'enable_api' is no longer supported. Use 'api_enabled'
    instead.

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - quickscale_modules_crm
      description: "CRM Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - crm/
            - quickscale_modules_crm.urls
      description: "CRM URL includes"
