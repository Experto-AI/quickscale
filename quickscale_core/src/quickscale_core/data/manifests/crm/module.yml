# CRM Module Manifest
# Defines configuration options and their mutability for the CRM module
# See decisions.md §Module Manifest Architecture for schema specification

name: crm
version: "0.87.0"
description: "Lightweight CRM module with contacts, companies, deals, and pipeline management"

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    enable_api:
      type: boolean
      default: true
      django_setting: CRM_ENABLE_API
      description: "Enable REST API endpoints at /crm/api/"

    deals_per_page:
      type: integer
      default: 25
      django_setting: CRM_DEALS_PER_PAGE
      description: "Number of deals per page in list views"

    contacts_per_page:
      type: integer
      default: 50
      django_setting: CRM_CONTACTS_PER_PAGE
      description: "Number of contacts per page in list views"

  immutable: {}

required_modules:
  - orgs>=0.86.0

implies:
  - name: orgs

# Dependencies required by this module
dependencies:
  - djangorestframework>=3.15.0
  - django-filter>=24.0

# Django apps that must be in INSTALLED_APPS
django_apps:
  - rest_framework
  - django_filters
  - quickscale_modules_crm

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - quickscale_modules_crm
      description: "CRM Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - ""
            - quickscale_modules_crm.urls
      description: "CRM URL includes"

  option_derivations:
    deals_per_page:
      derived_settings:
        - setting_key: CRM_DEALS_PER_PAGE
          source_options: [deals_per_page]
          derivation_type: direct
          expression:
            option: deals_per_page
          default: 25
          description: "Number of deals per page"

    contacts_per_page:
      derived_settings:
        - setting_key: CRM_CONTACTS_PER_PAGE
          source_options: [contacts_per_page]
          derivation_type: direct
          expression:
            option: contacts_per_page
          default: 50
          description: "Number of contacts per page"

    enable_api:
      derived_settings:
        - setting_key: CRM_ENABLE_API
          source_options: [enable_api]
          derivation_type: direct
          expression:
            option: enable_api
          default: true
          description: "Enable REST API endpoints"
