# Auth Module Manifest
# Defines configuration options and their mutability for the auth module
# See decisions.md §Module Manifest Architecture for schema specification

name: auth
version: "0.89.0"
description: "Production-ready authentication module using django-allauth"

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_AUTH_ENABLED
      description: "Enable the auth module. Off keeps the module installed with its data intact and mounts none of its public account URLs."
      validation: {}

    registration_enabled:
      type: boolean
      default: true
      django_setting: ACCOUNT_ALLOW_REGISTRATION
      description: "Allow new user registration"
      validation: {}

    email_verification:
      type: string
      default: "none"
      django_setting: ACCOUNT_EMAIL_VERIFICATION
      description: "Email verification requirement (none, optional, mandatory)"
      validation:
        choices: ["none", "optional", "mandatory"]

    session_cookie_age:
      type: integer
      default: 1209600
      django_setting: SESSION_COOKIE_AGE
      description: "Session cookie lifetime in seconds (default: 2 weeks)"
      validation:
        min: 1

  # Immutable options - locked at embed time, require remove + re-embed to change
  immutable:
    authentication_method:
      type: string
      default: "email"
      description: "Authentication method (email, username, both)"
      validation:
        choices: ["email", "username", "both"]

# Dependencies required by this module (bare names; specs live in pyproject.toml)
dependencies:
  - django-allauth
  - quickscale-core

# Retired option keys are refused by name with the message declared here.
retired_options:
  allow_registration: >-
    Legacy config key 'allow_registration' is no longer supported. Use
    'registration_enabled' instead.
  social_providers: >-
    Legacy config key 'social_providers' is no longer supported. Remove it
    from the auth module options.

# Required first-party modules (bare names; rule 39)
required_modules:
  - orgs

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - django.contrib.sites
          - quickscale_modules_auth
          - allauth
          - allauth.account
      description: "Auth Django app labels"
    - wiring_field: middleware
      derivation_type: static
      expression:
        value:
          - allauth.account.middleware.AccountMiddleware
      description: "Auth middleware (allauth account)"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - accounts/
            - allauth.urls
          - - accounts/
            - quickscale_modules_auth.urls
      description: "Auth URL includes"

  # Static settings the auth module always contributes while installed; the
  # login/signup composites derived from authentication_method stay in the
  # module adapter because they branch one option into a set and an ordered
  # list.
  derived_settings:
    - setting_key: AUTHENTICATION_BACKENDS
      derivation_type: static
      expression:
        value:
          - django.contrib.auth.backends.ModelBackend
          - allauth.account.auth_backends.AuthenticationBackend
    - setting_key: AUTH_USER_MODEL
      derivation_type: static
      expression:
        value: quickscale_auth.User
    - setting_key: SITE_ID
      derivation_type: static
      expression:
        value: 1
    # ACCOUNT_ADAPTER belongs to this module: auth owns the single allauth
    # adapter, which collects installed modules' declared post-auth redirect
    # hooks as AppConfig capabilities.
    - setting_key: ACCOUNT_ADAPTER
      derivation_type: static
      expression:
        value: quickscale_modules_auth.allauth_adapter.QuickscaleAccountAdapter
    - setting_key: ACCOUNT_SIGNUP_FORM_CLASS
      derivation_type: static
      expression:
        value: quickscale_modules_auth.forms.SignupForm
    - setting_key: LOGIN_REDIRECT_URL
      derivation_type: static
      expression:
        value: /accounts/profile/
    - setting_key: LOGOUT_REDIRECT_URL
      derivation_type: static
      expression:
        value: /
