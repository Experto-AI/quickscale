name: social
version: "0.89.0"
description: "Curated social links and embeds with fixed public routes and normalized provider contracts"

config:
  mutable:
    link_tree_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_SOCIAL_LINK_TREE_ENABLED
      description: "Enable the public link-tree surface at the fixed /social route."
      validation:
        any_of: [link_tree_enabled, embeds_enabled]

    layout_variant:
      type: string
      default: "list"
      django_setting: QUICKSCALE_SOCIAL_LAYOUT_VARIANT
      description: "Default link-tree presentation variant. Supported values in v0.79.0 are list, cards, and grid."
      validation:
        choices: ["list", "cards", "grid"]

    embeds_enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_SOCIAL_EMBEDS_ENABLED
      description: "Enable the public embed gallery surface at the fixed /social/embeds route."
      validation: {}

    provider_allowlist:
      type: list
      default: ["facebook", "instagram", "linkedin", "tiktok", "x", "youtube"]
      django_setting: QUICKSCALE_SOCIAL_PROVIDER_ALLOWLIST
      description: "Allowlisted social providers for curated links and embeds. Embed-capable providers in v0.79.0 are TikTok and YouTube."
      validation:
        not_empty: true
        choices: ["facebook", "instagram", "linkedin", "tiktok", "x", "youtube"]
        intersects:
          values: ["tiktok", "youtube"]
          when:
            embeds_enabled: true

    cache_ttl_seconds:
      type: integer
      default: 300
      django_setting: QUICKSCALE_SOCIAL_CACHE_TTL_SECONDS
      description: "Cache TTL in seconds for normalized social payloads and provider lookups."
      validation:
        min: 1

    links_per_page:
      type: integer
      default: 24
      django_setting: QUICKSCALE_SOCIAL_LINKS_PER_PAGE
      description: "Optional maximum number of curated links exposed through the fixed /social surface."
      validation:
        min: 1

    embeds_per_page:
      type: integer
      default: 12
      django_setting: QUICKSCALE_SOCIAL_EMBEDS_PER_PAGE
      description: "Optional maximum number of curated embeds exposed through the fixed /social/embeds surface."
      validation:
        min: 1

  immutable: {}

required_modules:
  - orgs>=0.86.0

implies:
  - name: orgs

dependencies: []

contract_vintage:
  minimum: "0.87.0"
  manual_adoption_steps:
    - "Public `/social` and `/social/embeds` pages are fresh-generation-only. Existing projects and non-React themes must manually adopt equivalent public pages. See `docs/technical/decisions.md` §Themes for the current scaffolding policy."

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - quickscale_modules_social
      description: "Social Django app label"

    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - _quickscale/social/
            - quickscale_managed.social_urls
      description: "Social URL include"

  option_derivations:
    layout_variant:
      normalization_rules:
        - source_key: layout_variant
          target_key: layout_variant
          rule_type: strip
          description: "Strip whitespace from the layout variant"
        - source_key: layout_variant
          target_key: layout_variant
          rule_type: lowercase
          description: "Canonicalize the layout variant to lowercase"
    provider_allowlist:
      normalization_rules:
        - source_key: provider_allowlist
          target_key: provider_allowlist
          rule_type: list
          item_rules:
            - rule_type: slug
              replace:
                "&": "and"
                "/": "-"
            - rule_type: choice_map
              mapping:
                facebook: facebook
                fb: facebook
                instagram: instagram
                ig: instagram
                linkedin: linkedin
                linked-in: linkedin
                tiktok: tiktok
                tik-tok: tiktok
                x: x
                twitter: x
                x-twitter: x
                x-twitter-com: x
                youtube: youtube
                you-tube: youtube
          description: "Split, slug, expand provider aliases, drop empties, and dedupe preserving order"

managed_files:
  social_init:
    renderer: social.managed_init
    output_path: quickscale_managed/__init__.py

  social_urls:
    renderer: social.managed_urls
    output_path: quickscale_managed/social_urls.py

  social_views:
    renderer: social.managed_views
    output_path: quickscale_managed/social_views.py
