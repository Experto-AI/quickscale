# Blog Module Manifest
# Defines configuration options and their mutability for the blog module

name: blog
version: "0.73.0"
description: "Markdown-powered blog module"

config:
  mutable:
    posts_per_page:
      type: integer
      default: 10
      django_setting: BLOG_POSTS_PER_PAGE
      description: "Number of blog posts per page"

    api_rate_limit:
      type: string
      default: "5/hour"
      django_setting: BLOG_API_RATE_LIMIT
      description: "Throttle rate for authenticated blog API requests (per IP). Format: '<count>/<period>'."

    enable_rss:
      type: boolean
      default: true
      django_setting: BLOG_ENABLE_RSS
      description: "Enable RSS routes at runtime"

  immutable:
    org_routing_enabled:
      type: boolean
      default: false
      django_setting: BLOG_ORG_ROUTING_ENABLED
      description: "Enable org-scoped blog routing (Phase 2 of F11.11)"

required_modules:
  - orgs

dependencies:
  - django-markdownx>=4.0
  - Pillow>=12.1.1,<13.0.0

django_apps:
  - markdownx
  - quickscale_modules_blog

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - markdownx
          - quickscale_modules_blog
      description: "Blog Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - ""
            - quickscale_modules_blog.urls
          - - markdownx/
            - markdownx.urls
      description: "Blog URL includes"

  option_derivations:
    posts_per_page:
      derived_settings:
        - setting_key: BLOG_POSTS_PER_PAGE
          source_options: [posts_per_page]
          derivation_type: direct
          expression:
            option: posts_per_page
          default: 10
          description: "Number of blog posts per page"

    enable_rss:
      derived_settings:
        - setting_key: BLOG_ENABLE_RSS
          source_options: [enable_rss]
          derivation_type: direct
          expression:
            option: enable_rss
          default: true
          description: "Enable RSS routes"

    api_rate_limit:
      derived_settings:
        - setting_key: BLOG_API_RATE_LIMIT
          source_options: [api_rate_limit]
          derivation_type: direct
          expression:
            option: api_rate_limit
          description: "Blog API rate limit"

    org_routing_enabled:
      derived_settings:
        - setting_key: BLOG_ORG_ROUTING_ENABLED
          source_options: [org_routing_enabled]
          derivation_type: direct
          expression:
            option: org_routing_enabled
          default: false
          description: "Enable org-scoped blog routing"
