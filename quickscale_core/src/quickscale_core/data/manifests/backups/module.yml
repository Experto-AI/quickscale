name: backups
version: "0.89.0"
description: "Private operational database backups with admin workflows and guarded CLI restores"

config:
  mutable:
    retention_days:
      type: integer
      default: 14
      django_setting: QUICKSCALE_BACKUPS_RETENTION_DAYS
      description: "Number of days backup artifacts are retained before pruning."
      validation:
        min: 1

    naming_prefix:
      type: string
      default: "db"
      django_setting: QUICKSCALE_BACKUPS_NAMING_PREFIX
      description: "Prefix used when generating backup filenames."
      validation:
        pattern: '(?s)^.*\S.*$'

    target_mode:
      type: string
      default: "local"
      django_setting: QUICKSCALE_BACKUPS_TARGET_MODE
      description: "Backup target mode: local or private_remote."
      validation:
        choices: ["local", "private_remote"]

    local_directory:
      type: string
      default: ".quickscale/backups"
      django_setting: QUICKSCALE_BACKUPS_LOCAL_DIRECTORY
      description: "Private local directory used for stored backup artifacts."
      validation:
        pattern: '(?s)^.*\S.*$'

    remote_bucket_name:
      type: string
      default: ""
      django_setting: QUICKSCALE_BACKUPS_REMOTE_BUCKET_NAME
      description: "Private S3-compatible bucket used when private_remote mode is enabled."
      validation:
        required_when:
          target_mode: private_remote

    remote_prefix:
      type: string
      default: "backups/private"
      django_setting: QUICKSCALE_BACKUPS_REMOTE_PREFIX
      description: "Object-key prefix for private remote backup artifacts."
      validation:
        pattern: '(?s)^.*\S.*$'

    remote_endpoint_url:
      type: string
      default: ""
      django_setting: QUICKSCALE_BACKUPS_REMOTE_ENDPOINT_URL
      description: "Optional custom S3-compatible endpoint URL."
      validation:
        required_when:
          target_mode: private_remote
        any_of:
          - remote_region_name

    remote_region_name:
      type: string
      default: ""
      django_setting: QUICKSCALE_BACKUPS_REMOTE_REGION_NAME
      description: "Cloud provider region (or auto for endpoint-driven providers)."
      validation: {}

    remote_access_key_id_env_var:
      type: string
      default: "QUICKSCALE_BACKUPS_REMOTE_ACCESS_KEY_ID"
      django_setting: QUICKSCALE_BACKUPS_REMOTE_ACCESS_KEY_ID_ENV_VAR
      description: "Environment-variable name containing the private remote access key id."
      validation:
        required_when:
          target_mode: private_remote
        pattern: '^(?!(?:AKIA|ASIA)[A-Z0-9]{16}$)(?:[A-Z][A-Z0-9_]*)?$'

    remote_secret_access_key_env_var:
      type: string
      default: "QUICKSCALE_BACKUPS_REMOTE_SECRET_ACCESS_KEY"
      django_setting: QUICKSCALE_BACKUPS_REMOTE_SECRET_ACCESS_KEY_ENV_VAR
      description: "Environment-variable name containing the private remote secret access key."
      validation:
        required_when:
          target_mode: private_remote
        pattern: '^(?:[A-Z][A-Z0-9_]*)?$'

    automation_enabled:
      type: boolean
      default: false
      django_setting: QUICKSCALE_BACKUPS_AUTOMATION_ENABLED
      description: "Document whether cron or platform schedulers should invoke backup commands."
      validation: {}

    schedule:
      type: string
      default: "0 2 * * *"
      django_setting: QUICKSCALE_BACKUPS_SCHEDULE
      description: "Cron-like schedule documentation for command-driven backup automation."
      validation:
        required_when:
          automation_enabled: true

  immutable: {}

contract_vintage:
  minimum: "0.87.0"
  manual_adoption_steps:
    - "PostgreSQL 18 backups contract requires updated Docker image packages and CI runner tooling. Existing generated projects must manually update Dockerfile, docker-compose.yml, and CI workflow files. See `docs/technical/implementation_contract.md` and `docs/technical/decisions.md` §Backups-Contract for the tooling specification."

dependencies:
  - django-storages>=1.14.6
  - boto3>=1.43.58
  - quickscale-core>=0.89.0,<0.90.0

# Retired option keys are refused by name with the message declared here.
retired_options:
  remote_access_key_id: >-
    Legacy config key 'remote_access_key_id' is no longer supported. Use
    'remote_access_key_id_env_var' to reference an environment variable
    instead.
  remote_secret_access_key: >-
    Legacy config key 'remote_secret_access_key' is no longer supported. Use
    'remote_secret_access_key_env_var' to reference an environment variable
    instead.

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - quickscale_modules_backups
      description: "Backups Django app label"

  option_derivations:
    naming_prefix:
      normalization_rules:
        - source_key: naming_prefix
          target_key: naming_prefix
          rule_type: strip
          description: "Strip whitespace from naming_prefix"
    local_directory:
      normalization_rules:
        - source_key: local_directory
          target_key: local_directory
          rule_type: strip
          description: "Strip whitespace from local_directory"
    remote_bucket_name:
      normalization_rules:
        - source_key: remote_bucket_name
          target_key: remote_bucket_name
          rule_type: strip
          description: "Strip whitespace from remote_bucket_name"
    remote_prefix:
      normalization_rules:
        - source_key: remote_prefix
          target_key: remote_prefix
          rule_type: strip
          description: "Strip whitespace from remote_prefix"
    remote_endpoint_url:
      normalization_rules:
        - source_key: remote_endpoint_url
          target_key: remote_endpoint_url
          rule_type: strip
          description: "Strip whitespace from remote_endpoint_url"
    remote_region_name:
      normalization_rules:
        - source_key: remote_region_name
          target_key: remote_region_name
          rule_type: strip
          description: "Strip whitespace from remote_region_name"
    remote_access_key_id_env_var:
      normalization_rules:
        - source_key: remote_access_key_id_env_var
          target_key: remote_access_key_id_env_var
          rule_type: strip
          description: "Strip whitespace from remote_access_key_id_env_var"
    remote_secret_access_key_env_var:
      normalization_rules:
        - source_key: remote_secret_access_key_env_var
          target_key: remote_secret_access_key_env_var
          rule_type: strip
          description: "Strip whitespace from remote_secret_access_key_env_var"
    target_mode:
      normalization_rules:
        - source_key: target_mode
          target_key: target_mode
          rule_type: strip
          description: "Strip whitespace from target_mode"
        - source_key: target_mode
          target_key: target_mode
          rule_type: lowercase
          description: "Canonicalize target_mode to lowercase"
