name: storage
version: "0.89.0"
description: "Shared media storage infrastructure with local and S3-compatible backends"

config:
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_STORAGE_ENABLED
      description: "Enable the storage module. Off keeps the module installed with its data intact and skips the vendor-credential startup check."
      validation: {}

    backend:
      type: string
      default: "local"
      django_setting: QUICKSCALE_STORAGE_BACKEND
      description: "Storage backend: local, s3, or r2"
      validation:
        choices: ["local", "s3", "r2"]

    media_url:
      type: string
      default: "/media/"
      django_setting: MEDIA_URL
      description: "Base media URL for local/public delivery"
      validation: {}

    public_base_url:
      type: string
      default: ""
      django_setting: QUICKSCALE_STORAGE_PUBLIC_BASE_URL
      description: "Optional absolute CDN/base URL used as the canonical source for helper-built public media URLs"
      validation:
        pattern: &absolute_url '^(?:https?://(?:[A-Za-z0-9.-]+|\[(?:(?:[a-fA-F0-9]{1,4}:){7}[a-fA-F0-9]{1,4}|(?:[a-fA-F0-9]{1,4}:){1,7}:|(?:[a-fA-F0-9]{1,4}:){1,6}:[a-fA-F0-9]{1,4}|(?:[a-fA-F0-9]{1,4}:){1,5}(?::[a-fA-F0-9]{1,4}){1,2}|(?:[a-fA-F0-9]{1,4}:){1,4}(?::[a-fA-F0-9]{1,4}){1,3}|(?:[a-fA-F0-9]{1,4}:){1,3}(?::[a-fA-F0-9]{1,4}){1,4}|(?:[a-fA-F0-9]{1,4}:){1,2}(?::[a-fA-F0-9]{1,4}){1,5}|[a-fA-F0-9]{1,4}:(?::[a-fA-F0-9]{1,4}){1,6}|:(?:(?::[a-fA-F0-9]{1,4}){1,7}|:)|(?:(?:[a-fA-F0-9]{1,4}:){6}|::(?:[a-fA-F0-9]{1,4}:){0,5}|(?=(?:[^:\]]*:){2,6}[^:\]]*\])[a-fA-F0-9]{1,4}(?::[a-fA-F0-9]{1,4}){0,4}::(?:[a-fA-F0-9]{1,4}:){0,4})(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))\])(?::[0-9]+)?(?:[/?#][^\s]*)?)?$'

    bucket_name:
      type: string
      default: ""
      django_setting: AWS_STORAGE_BUCKET_NAME
      description: "S3-compatible bucket name when cloud storage is enabled"
      validation: {}

    endpoint_url:
      type: string
      default: ""
      django_setting: AWS_S3_ENDPOINT_URL
      description: "Optional S3 endpoint URL (required for Cloudflare R2)"
      validation:
        pattern: *absolute_url

    region_name:
      type: string
      default: ""
      django_setting: AWS_S3_REGION_NAME
      description: "Cloud provider region name (or auto for endpoint providers)"
      validation: {}

    access_key_id_env_var:
      type: string
      default: "AWS_ACCESS_KEY_ID"
      django_setting: QUICKSCALE_STORAGE_ACCESS_KEY_ID_ENV_VAR
      description: "Environment variable name for the S3-compatible access key id"
      validation:
        required_when:
          backend: ["s3", "r2"]
        pattern: '^(?!(?:AKIA|ASIA)[A-Z0-9]{16}$)(?:[A-Z][A-Z0-9_]*)?$'

    secret_access_key_env_var:
      type: string
      default: "AWS_SECRET_ACCESS_KEY"
      django_setting: QUICKSCALE_STORAGE_SECRET_ACCESS_KEY_ENV_VAR
      description: "Environment variable name for the S3-compatible secret access key"
      validation:
        required_when:
          backend: ["s3", "r2"]
        pattern: '^(?:[A-Z][A-Z0-9_]*)?$'

    default_acl:
      type: string
      default: ""
      django_setting: AWS_DEFAULT_ACL
      description: "Default ACL for uploaded objects (blank recommended for modern buckets)"
      validation: {}

    querystring_auth:
      type: boolean
      default: false
      django_setting: AWS_QUERYSTRING_AUTH
      description: "When false, media URLs are public and cache-friendly"
      validation: {}

  immutable:
    private_media_enabled:
      type: boolean
      default: false
      description: "Reserved extension point for future private media authorization flows"
      validation: {}

required_modules: []

dependencies:
  - django-storages
  - boto3
  - Pillow
  - quickscale-core

# Retired option keys are refused by name with the message declared here.
retired_options:
  custom_domain: >-
    Legacy config key 'custom_domain' is no longer supported. Use
    'public_base_url' instead.
  access_key_id: >-
    Legacy config key 'access_key_id' is no longer supported. Use
    'access_key_id_env_var' to reference an environment variable instead.
  secret_access_key: >-
    Legacy config key 'secret_access_key' is no longer supported. Use
    'secret_access_key_env_var' to reference an environment variable instead.

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - quickscale_modules_storage
      description: "Storage Django app label"

  # The immutable switch has no django_setting of its own; the derived-setting
  # vocabulary is its one home: the projected setting equals the option value.
  derived_settings:
    - setting_key: QUICKSCALE_STORAGE_PRIVATE_MEDIA_ENABLED
      derivation_type: direct
      expression:
        option: private_media_enabled
      description: "Reserved private-media authorization switch"
    - setting_key: AWS_ACCESS_KEY_ID
      derivation_type: computed
      expression:
        template: "__QS_ENV__:{access_key_id_env_var}"
        when:
          backend: [s3, r2]
        omit_if_blank: [access_key_id_env_var]
      description: "Deferred cloud access-key alias; absent locally or when blank"
    - setting_key: AWS_SECRET_ACCESS_KEY
      derivation_type: computed
      expression:
        template: "__QS_ENV__:{secret_access_key_env_var}"
        when:
          backend: [s3, r2]
        omit_if_blank: [secret_access_key_env_var]
      description: "Deferred cloud secret-key alias; absent locally or when blank"

  option_derivations:
    backend:
      normalization_rules:
        - source_key: backend
          target_key: backend
          rule_type: strip
          description: "Strip whitespace from backend"
        - source_key: backend
          target_key: backend
          rule_type: lowercase
          description: "Canonicalize backend to lowercase"
    media_url:
      normalization_rules:
        - source_key: media_url
          target_key: media_url
          rule_type: path_or_absolute_url
          description: "Canonical relative-or-absolute media URL; blanks use the declared default"
    public_base_url:
      normalization_rules:
        - source_key: public_base_url
          target_key: public_base_url
          rule_type: url
          description: "Canonicalize the optional absolute public base URL"
    bucket_name:
      normalization_rules:
        - source_key: bucket_name
          target_key: bucket_name
          rule_type: strip
          description: "Strip whitespace from bucket_name"
    endpoint_url:
      normalization_rules:
        - source_key: endpoint_url
          target_key: endpoint_url
          rule_type: url
          description: "Canonicalize the optional absolute S3 endpoint URL"
    region_name:
      normalization_rules:
        - source_key: region_name
          target_key: region_name
          rule_type: strip
          description: "Strip whitespace from region_name"
    access_key_id_env_var:
      normalization_rules:
        - source_key: access_key_id_env_var
          target_key: access_key_id_env_var
          rule_type: strip
          description: "Strip whitespace from access_key_id_env_var"
    secret_access_key_env_var:
      normalization_rules:
        - source_key: secret_access_key_env_var
          target_key: secret_access_key_env_var
          rule_type: strip
          description: "Strip whitespace from secret_access_key_env_var"
    default_acl:
      normalization_rules:
        - source_key: default_acl
          target_key: default_acl
          rule_type: strip
          description: "Strip whitespace from default_acl"
