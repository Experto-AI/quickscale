[project]
name = "quickscale-core"
version = "0.87.0"
description = "Core scaffolding and utilities for QuickScale Django project generator"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
keywords = ["django", "scaffolding", "project-generator", "saas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Experto-AI/quickscale"
Repository = "https://github.com/Experto-AI/quickscale"
Documentation = "https://github.com/Experto-AI/quickscale/tree/main/docs"

[tool.poetry]
packages = [{include = "quickscale_core", from = "src"}]
include = [
    "src/quickscale_core/generator/templates/**/*",
    "src/quickscale_core/data/manifests/*/module.yml",
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Jinja2 = "^3.1.6"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
# Dev dependencies centralized in root pyproject.toml
# Use: poetry install from repository root

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=quickscale_core",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "-m", "not e2e",  # Skip E2E tests by default (run with: pytest -m e2e)
]
markers = [
    "integration: integration tests (slower, require external dependencies)",
    "slow: slow tests that take significant time to run",
    "e2e: end-to-end tests",
]
# Note: Playwright base_url is configured via --base-url flag when running E2E tests
# Example: pytest -m e2e --base-url http://localhost:8000

[tool.coverage.run]
source = ["src/quickscale_core"]
omit = [
    "*/tests/*",
    "tests/*",
    "**/test_*.py",
    "**/conftest.py",
    "**/*.j2",
    "*.j2",
]

[tool.coverage.report]
fail_under = 90
# Per-file minimum target: 80% (enforced via code review)
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

# Ruff and mypy configurations centralized in root ruff.toml and mypy.ini
# Ruff treats this file as its config root for the package (any [tool.ruff.*]
# table does that), so the root ruff.toml's target-version does NOT apply here
# and Ruff would otherwise infer py314 from requires-python above. Restate it:
# so it must be restated here to stay in step with the root ruff.toml.
[tool.ruff]
target-version = "py314"

# Ruff's default rule set, restated explicitly. Because this file shadows the
# root ruff.toml (see above), these packages have always been linted with
# Ruff's built-in defaults rather than the shared select. Pinning them makes
# that dependency-on-a-default explicit, so a Ruff release that widens its
# defaults lands as a deliberate opt-in rather than hundreds of surprise
# findings (0.16 widened them by ~486 across these two packages).
# Adopting the shared select here is worthwhile but is its own cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# NOTE: `I` (isort) is not in the select above, so the [tool.ruff.lint.isort]
# override below is currently inert — it configures a rule that is not
# enabled. It is kept because it becomes correct the moment this package
# adopts the shared select (which does enable `I`); see implementation_contract.md.

# Package-specific isort override
[tool.ruff.lint.isort]
known-first-party = ["quickscale_core"]
