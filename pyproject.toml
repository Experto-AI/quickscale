[project]
name = "quickscale-module-storage"
version = "0.87.0"
description = "QuickScale storage infrastructure module with local/S3-compatible helpers"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "quickscale_modules_storage", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Django = ">=6.0.7,<6.1.0"
django-storages = {version = "^1.14.6", optional = true}
boto3 = {version = "^1.43.58", optional = true}
Pillow = ">=12.3.0,<13.0.0"

[tool.poetry.extras]
cloud = ["django-storages", "boto3"]

[tool.poetry.group.dev.dependencies]
pytest-django = "^4.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"

# Ruff's default rule set, restated explicitly. Any [tool.ruff.*] table makes
# this file Ruff's config root for the module, which shadows the repo-root
# ruff.toml — so this module has always been linted with Ruff's built-in
# defaults, never the shared select. Pinning them makes that implicit
# dependency explicit: a Ruff release that widens its defaults then lands as
# a deliberate opt-in instead of a wall of surprise findings (0.16 widened
# them by ~900 across the modules). Adopting the shared select here is
# worthwhile, but it is its own cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = "storages.*"
ignore_missing_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --cov=quickscale_modules_storage --cov-report=html --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
fail_under = 90
