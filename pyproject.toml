[project]
name = "quickscale-module-orgs"
version = "0.87.0"
description = "QuickScale organizations module with core multi-tenant organization, membership, and invitation models"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "quickscale_modules_orgs", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Django = ">=6.0.7,<6.1.0"
django-allauth = ">=65.18.0,<66.0.0"

[tool.poetry.group.dev.dependencies]
pytest-django = "^4.11.1"
django-filter = ">=25.2"
django-markdownx = ">=4.0.9"
pillow = ">=12.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"

# Ruff's default rule set, restated explicitly. Any [tool.ruff.*] table makes
# this file Ruff's config root for the module, which shadows the repo-root
# ruff.toml — so this module has always been linted with Ruff's built-in
# defaults, never the shared select. Pinning them makes that implicit
# dependency explicit: a Ruff release that widens its defaults then lands as
# a deliberate opt-in instead of a wall of surprise findings (0.16 widened
# them by ~900 across the modules). Adopting the shared select here is
# worthwhile, but it is its own cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src", "../billing/src", "../social/src", "../forms/src", "../listings/src", "../blog/src", "../crm/src"]
python_files = ["test_*.py"]
norecursedirs = [".*", "build", "dist", "node_modules", "quickscale_cli", "quickscale_core", "analytics", "auth", "backups", "billing", "blog", "crm", "forms", "listings", "notifications", "social", "storage", "teams"]
testpaths = ["tests"]
addopts = "-v --cov=quickscale_modules_orgs --cov-report=html --cov-report=term-missing --cov-fail-under=90"
markers = [
    "bypass_rls: test requires BYPASSRLS database privilege (superuser / migration DDL). Skipped when QUICKSCALE_ALLOW_BYPASSRLS is not set.",
]

[tool.coverage.report]
fail_under = 90

[tool.django-stubs]
django_settings_module = "tests.settings"
