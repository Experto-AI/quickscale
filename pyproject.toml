[project]
name = "quickscale-module-auth"
version = "0.87.0"
description = "QuickScale authentication module with django-allauth integration"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "quickscale_modules_auth", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Django = ">=6.0.7,<6.1.0"
django-allauth = ">=65.18.0,<66.0.0"

[tool.poetry.group.dev.dependencies]
# Minimal dev dependencies for standalone testing
# pytest, pytest-cov, ruff, mypy centralized in root pyproject.toml (monorepo)
# or provided by user's project (standalone embed)
pytest-django = "^4.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff and mypy configurations centralized in root ruff.toml and mypy.ini
# Package-specific overrides:

[tool.ruff]
target-version = "py314"

# Ruff's default rule set, restated explicitly. Any [tool.ruff.*] table makes
# this file Ruff's config root for the module, which shadows the repo-root
# ruff.toml — so this module has always been linted with Ruff's built-in
# defaults, never the shared select. Pinning them makes that implicit
# dependency explicit: a Ruff release that widens its defaults then lands as
# a deliberate opt-in instead of a wall of surprise findings (0.16 widened
# them by ~900 across the modules). Adopting the shared select here is
# worthwhile, but it is its own cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = "allauth.*"
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --cov=src/quickscale_modules_auth --cov-report=html --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
fail_under = 90
# Per-file minimum target: 80% (enforced via code review)
