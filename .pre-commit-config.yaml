minimum_pre_commit_version: 3.7.0

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        exclude: ^quickscale_core/src/quickscale_core/generator/templates/themes/showcase_react/tsconfig\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (poetry)
        entry: poetry run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (poetry)
        entry: poetry run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
