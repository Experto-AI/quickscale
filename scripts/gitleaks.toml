# gitleaks configuration for the QuickScale secret-scanning gate (SA202, SA326).
#
# The default ruleset is extended, never replaced.  This file holds structural
# exclusions only: generated scratch trees and non-source directories that are
# gitignored and never committed.  Every value-level exemption is an entry in
# `scripts/secret_scan_suppressions.json`, where it carries an owner, a
# rationale, a decision reference, and an expiry date; an expired or unused
# entry fails the gate.  Anything not listed in either file fails the gate.

[extend]
useDefault = true

[[allowlists]]
description = "Generated .quickscale/ scratch state (linter caches, migration proof projects): gitignored and never committed."
paths = ['''\.quickscale/''']

[[allowlists]]
description = "The secret-suppression ledger itself: it records finding fingerprints (which contain rule ids such as stripe-access-token) and written rationales, never a credential value."
paths = ['''secret_scan_suppressions\.json$''']

[[allowlists]]
description = "Non-source trees: virtualenvs, Node modules, VCS internals, and coverage/analysis output."
paths = [
    '''^\.venv/''',
    '''/\.venv/''',
    '''node_modules/''',
    '''^\.git/''',
    '''/\.git/''',
    '''htmlcov/''',
    '''graphify-out/''',
    '''__pycache__/''',
    '''\.pyc$''',
    '''\.coverage$''',
]
