    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Python 3.14
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.14"

    - name: Install Poetry
      id: install-poetry-cli
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: 2.4.1
      # Retry on SSL/network failures
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry-cli.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - --version 2.4.1 && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --with dev

    - name: Run linting
      run: |
        make lint -- --cli --devtools

    - name: Run type checking
      run: |
        make typecheck -- --cli --devtools
