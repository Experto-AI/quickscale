name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backups-validation:
    name: Fail Fast Backups PG18 Contract
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install PostgreSQL 18 client tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl
        distro_codename="$(
          . /etc/os-release
          echo "$VERSION_CODENAME"
        )"
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt ${distro_codename}-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y postgresql-client-18
        echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

    - name: Verify PostgreSQL 18 client tooling
      run: |
        test -x /usr/lib/postgresql/18/bin/pg_dump
        test -x /usr/lib/postgresql/18/bin/pg_restore
        test "$(command -v pg_dump)" = "/usr/lib/postgresql/18/bin/pg_dump"
        test "$(command -v pg_restore)" = "/usr/lib/postgresql/18/bin/pg_restore"
        /usr/lib/postgresql/18/bin/pg_dump --version | grep -F "(PostgreSQL) 18"
        /usr/lib/postgresql/18/bin/pg_restore --version | grep -F "(PostgreSQL) 18"

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Create test database for backups module
      run: |
        createdb -h localhost -U postgres test_quickscale_backups 2>/dev/null || echo "Database already exists"

    - name: Run backups module validation tests
      env:
        # SA59.2 — explicitly export QS_BACKUPS_DB_* to runtime-prove the
        # env-var seam instead of relying on fallback defaults.
        # Values match the postgres:18 service container config above.
        QS_BACKUPS_DB_NAME: test_quickscale_backups
        QS_BACKUPS_DB_USER: postgres
        QS_BACKUPS_DB_HOST: localhost
        QS_BACKUPS_DB_PORT: 5432
      run: |
        PYTHONPATH="quickscale_modules/backups:quickscale_modules/backups/src" \
          poetry run pytest quickscale_modules/backups/tests -q --no-cov \
            -p pytest_django --ds=tests.settings

  module-manifest-contract:
    name: Fail Fast Ready Module Contract
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Run ready-module manifest contract tests
      run: |
        poetry run pytest quickscale_cli/tests/test_module_manifest_contract.py -q

  module-core-compat:
    name: Module-vs-Oldest-Core Compatibility
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Run module-vs-core compatibility check (static analysis + install/import probe)
      run: |
        make check-core-compat

  module-core-import-linter:
    name: Module-Core Import Linter
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Run module-core import linter
      run: |
        make check-module-core-imports

  manifest-sync-gate:
    name: Manifest Sync Gate (SA16.1)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Verify module manifests match core snapshots
      run: |
        make check-manifest-sync

  org-context-primitives-gate:
    name: Org-Context Primitives Gate (SA13.4)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Verify no external use of privatized org-context primitives
      run: |
        make check-org-context-primitives

  csrf-exempt-gate:
    name: CSRF-Exempt Gate (SA46)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Verify every csrf_exempt callsite pairs with _enforce_csrf or signature verification
      run: |
        make check-csrf-exempt

  test:
    name: Run Tests (Unit + Integration)
    needs: [backups-validation, module-manifest-contract, module-core-compat, module-core-import-linter, manifest-sync-gate, org-context-primitives-gate, csrf-exempt-gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      id: install-poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
      # Retry on SSL/network failures
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache Poetry dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Check for stale sub-package venvs
      run: |
        # Fail if any sub-package has a local .venv (should use root venv)
        # This prevents version drift between packages
        STALE_VENVS=$(find quickscale_core quickscale_cli quickscale quickscale_modules -maxdepth 2 -type d -name ".venv" 2>/dev/null || true)
        if [ -n "$STALE_VENVS" ]; then
          echo "ERROR: Found stale .venv directories in sub-packages:"
          echo "$STALE_VENVS"
          echo ""
          echo "Sub-packages must use the root monorepo venv to prevent version drift."
          echo "Delete these directories and use 'poetry install' from root instead."
          exit 1
        fi
        echo "✓ No stale .venv directories found"

    - name: Run linting (ruff)
      run: |
        make lint -- --core --cli --modules --devtools

    - name: Run worker pool harness tests (no PostgreSQL needed)
      run: |
        make test-integration-worker-pool

    - name: Run local CI parallelism regression tests (no PostgreSQL needed)
      run: |
        make test-ci-local-parallel

    - name: Run type checking (mypy)
      run: |
        make typecheck -- --core --cli --modules --devtools

    - name: Create test databases in PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends postgresql-client
        for db in \
          test_quickscale_smoke \
          test_quickscale_analytics \
          test_quickscale_auth \
          test_quickscale_backups \
          test_quickscale_billing \
          test_quickscale_blog \
          test_quickscale_crm \
          test_quickscale_forms \
          test_quickscale_listings \
          test_quickscale_notifications \
          test_quickscale_orgs \
          test_quickscale_social \
          test_quickscale_storage; do
          createdb -h localhost -U postgres "$db" 2>/dev/null || echo "Database $db already exists"
        done

    - name: Provision PostgreSQL test roles (SA59.3)
      run: |
        ./scripts/provision_test_roles.sh

        ROLE="quickscale_test_role"

        # Grant ownership of all test databases to the restricted role so
        # Django's test runner can create test_* databases from these templates.
        for db in \
          test_quickscale_analytics \
          test_quickscale_auth \
          test_quickscale_backups \
          test_quickscale_billing \
          test_quickscale_blog \
          test_quickscale_crm \
          test_quickscale_forms \
          test_quickscale_listings \
          test_quickscale_notifications \
          test_quickscale_orgs \
          test_quickscale_social \
          test_quickscale_storage; do
          psql -h localhost -U postgres -c "ALTER DATABASE \"$db\" OWNER TO ${ROLE};"
          psql -h localhost -U postgres -d "$db" -c "GRANT ALL ON SCHEMA public TO ${ROLE};"
        done
        echo "✓ Database ownership and schema permissions granted to ${ROLE}"

    - name: Run unit tests (core + CLI, DB-free)
      run: |
        make test-unit SECTION="core cli"

    - name: Run integration tests (modules, PostgreSQL NOBYPASSRLS gate)
      env:
        # Keep the SA58 boot guard active against the NOBYPASSRLS/NOSUPERUSER role.
        QUICKSCALE_ALLOW_BYPASSRLS: "0"
        # Wire every PostgreSQL-using module's test settings to the
        # restricted role so module suites run without BYPASSRLS/SUPERUSER.
        QS_ANALYTICS_DB_USER: quickscale_test_role
        QS_AUTH_DB_USER: quickscale_test_role
        QS_BACKUPS_DB_USER: quickscale_test_role
        QS_BILLING_DB_USER: quickscale_test_role
        QS_BLOG_DB_USER: quickscale_test_role
        QS_CRM_DB_USER: quickscale_test_role
        QS_FORMS_DB_USER: quickscale_test_role
        QS_LISTINGS_DB_USER: quickscale_test_role
        QS_NOTIFICATIONS_DB_USER: quickscale_test_role
        QS_ORGS_DB_USER: quickscale_test_role
        QS_SOCIAL_DB_USER: quickscale_test_role
        QS_STORAGE_DB_USER: quickscale_test_role
      run: |
        ./scripts/test_integration.sh

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: always() && github.ref == 'refs/heads/main'
      with:
        files: ./quickscale_core/coverage.xml,./quickscale_cli/coverage.xml,./quickscale_modules/*/coverage.xml
        flags: unittests,integration
        name: codecov-umbrella
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  isolation-conformance:
    name: Isolation Conformance (AF10)
    needs: [backups-validation, module-manifest-contract, manifest-sync-gate, org-context-primitives-gate, csrf-exempt-gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      id: install-poetry-iso
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry-iso.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache Poetry dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Create test databases in PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends postgresql-client
        for db in \
          test_quickscale_smoke \
          test_quickscale_analytics \
          test_quickscale_auth \
          test_quickscale_billing \
          test_quickscale_blog \
          test_quickscale_crm \
          test_quickscale_forms \
          test_quickscale_listings \
          test_quickscale_notifications \
          test_quickscale_orgs \
          test_quickscale_social \
          test_quickscale_storage; do
          createdb -h localhost -U postgres "$db" 2>/dev/null || echo "Database $db already exists"
        done

    - name: Run isolation-conformance suite
      run: |
        ./scripts/test_isolation_conformance.sh

  lint-cli:
    name: Lint CLI Package
    needs: [backups-validation, module-manifest-contract, manifest-sync-gate, org-context-primitives-gate, csrf-exempt-gate]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Poetry
      id: install-poetry-cli
      uses: snok/install-poetry@v1
      # Retry on SSL/network failures
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry-cli.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install --with dev

    - name: Run linting
      run: |
        make lint -- --cli --devtools

    - name: Run type checking
      run: |
        make typecheck -- --cli --devtools
