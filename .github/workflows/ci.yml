      with:
        version: 2.4.1
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Provision hosted PostgreSQL backups profile
      run: scripts/provision_ci_postgres.sh hosted-setup --profile backups

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Run backups module validation tests
      run: |
        PYTHONPATH="quickscale_modules/backups:quickscale_modules/backups/src" \
          poetry run pytest quickscale_modules/backups/tests -q --no-cov \
