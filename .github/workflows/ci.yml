  test:
    name: Run Tests (Unit + Integration)
    # BEGIN GENERATED: needs-test
    needs: [backups-validation, module-manifest-contract, module-core-compat, module-core-import-linter, manifest-sync-gate, module-app-declaration-gate, org-context-primitives-gate, csrf-exempt-gate, commit-testimony-gate, check-gate-suites, dependency-vulnerabilities-gate, security-static-analysis-gate, beta-migration-smoke-gate, generated-deploy-posture-gate, workflow-security-gate, secret-scanning-gate]
    # END GENERATED: needs-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      id: install-poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: 2.4.1
        virtualenvs-create: true
        virtualenvs-in-project: true
      # Retry on SSL/network failures
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - --version 2.4.1 && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache Poetry dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Run gate parity check
      run: |
        make check-gate-parity

    - name: Check for stale sub-package venvs
      run: |
        # Fail if any sub-package has a local .venv (should use root venv)
        # This prevents version drift between packages
        STALE_VENVS=$(find quickscale_core quickscale_cli quickscale quickscale_modules -maxdepth 2 -type d -name ".venv" 2>/dev/null || true)
        if [ -n "$STALE_VENVS" ]; then
          echo "ERROR: Found stale .venv directories in sub-packages:"
          echo "$STALE_VENVS"
          echo ""
          echo "Sub-packages must use the root monorepo venv to prevent version drift."
          echo "Delete these directories and use 'poetry install' from root instead."
          exit 1
        fi
        echo "✓ No stale .venv directories found"

    - name: Run linting (ruff)
      run: |
        make lint -- --core --cli --modules --devtools

    - name: Run worker pool harness tests (no PostgreSQL needed)
      run: |
        make test-integration-worker-pool

    - name: Run local CI parallelism regression tests (no PostgreSQL needed)
      run: |
        make test-ci-local-parallel

    - name: Run type checking (mypy)
      run: |
        make typecheck -- --core --cli --modules --devtools

    - name: Provision hosted PostgreSQL restricted profile
      run: scripts/provision_ci_postgres.sh hosted-setup --profile restricted

    - name: Run unit tests (core + CLI, DB-free)
      run: |
        make test-unit SECTION="core cli"

    - name: Run integration tests (modules, PostgreSQL NOBYPASSRLS gate)
      run: |
        ./scripts/test_integration.sh

    - name: Upload coverage reports
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      if: always() && github.ref == 'refs/heads/main'
      with:
        files: ./quickscale_core/coverage.xml,./quickscale_cli/coverage.xml,./quickscale_modules/*/coverage.xml
        flags: unittests,integration
        name: codecov-umbrella
      env:
