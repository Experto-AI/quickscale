# QuickScale CD Pipeline - Publish to PyPI
# Triggers on version tag pushes ([0-9]* or v[0-9]*)
# Uses Trusted Publishing (OIDC) for secure PyPI authentication

name: Publish to PyPI

on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"

jobs:
  verify:
    name: Verify Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Get version from tag
        id: get_version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v}
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $TAG_VERSION"

      - name: Verify tag matches VERSION file
        run: |
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          FILE_VERSION=$(cat VERSION | tr -d '\r' | sed -e 's/^\s*//' -e 's/\s*$//')
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "❌ Version mismatch!"
            echo "   VERSION file: $FILE_VERSION"
            echo "   Git tag: $TAG_VERSION"
            exit 1
          fi
          echo "✅ VERSION verified: $FILE_VERSION"

      - name: Verify pyproject versions match VERSION
        run: |
          ./scripts/version_tool.sh check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: |
          poetry install --with dev

      - name: Run linting (ruff)
        run: |
          make lint -- --core --cli --modules

      - name: Run type checking (mypy)
        run: |
          make typecheck -- --core --cli --modules

      - name: Create test databases in PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client
          for db in \
            test_quickscale_smoke \
            test_quickscale_analytics \
            test_quickscale_auth \
            test_quickscale_billing \
            test_quickscale_blog \
            test_quickscale_crm \
            test_quickscale_forms \
            test_quickscale_listings \
            test_quickscale_notifications \
            test_quickscale_orgs \
            test_quickscale_social \
            test_quickscale_storage; do
            createdb -h localhost -U postgres "$db" 2>/dev/null || echo "Database $db already exists"
          done

      - name: Create PostgreSQL restricted role for module tests
        run: |
          ROLE="quickscale_test_role"
          psql -h localhost -U postgres -tc \
            "SELECT 1 FROM pg_roles WHERE rolname = '${ROLE}'" \
            | grep -q 1 \
            || psql -h localhost -U postgres -c \
              "CREATE ROLE ${ROLE} WITH LOGIN CREATEDB NOBYPASSRLS NOSUPERUSER"
          echo "✓ ${ROLE} created with NOBYPASSRLS NOSUPERUSER"

          # Verify the role cannot bypass RLS or act as superuser.
          for attr in rolbypassrls rolsuper; do
            val=$(psql -h localhost -U postgres -tc \
              "SELECT ${attr} FROM pg_roles WHERE rolname = '${ROLE}'" \
              | tr -d ' ')
            if [ "$val" != "f" ]; then
              echo "ERROR: ${ROLE} has ${attr}=${val} — module tests would bypass RLS!"
              exit 1
            fi
            echo "  ${attr}=${val} ✓"
          done

          # Grant ownership of all test databases to the restricted role so
          # Django's test runner can create test_* databases from these templates.
          for db in \
            test_quickscale_analytics \
            test_quickscale_auth \
            test_quickscale_billing \
            test_quickscale_blog \
            test_quickscale_crm \
            test_quickscale_forms \
            test_quickscale_listings \
            test_quickscale_notifications \
            test_quickscale_orgs \
            test_quickscale_social \
            test_quickscale_storage; do
            psql -h localhost -U postgres -c "ALTER DATABASE \"$db\" OWNER TO ${ROLE};"
            psql -h localhost -U postgres -d "$db" -c "GRANT ALL ON SCHEMA public TO ${ROLE};"
          done
          echo "✓ Database ownership and schema permissions granted to ${ROLE}"

      - name: Run unit tests (core + CLI, DB-free)
        run: |
          make test-unit SECTION="core cli"

      - name: Run integration tests (modules, PostgreSQL NOBYPASSRLS gate)
        env:
          QUICKSCALE_ALLOW_BYPASSRLS: "0"
          QS_ANALYTICS_DB_USER: quickscale_test_role
          QS_AUTH_DB_USER: quickscale_test_role
          QS_BILLING_DB_USER: quickscale_test_role
          QS_BLOG_DB_USER: quickscale_test_role
          QS_CRM_DB_USER: quickscale_test_role
          QS_FORMS_DB_USER: quickscale_test_role
          QS_LISTINGS_DB_USER: quickscale_test_role
          QS_NOTIFICATIONS_DB_USER: quickscale_test_role
          QS_ORGS_DB_USER: quickscale_test_role
          QS_SOCIAL_DB_USER: quickscale_test_role
          QS_STORAGE_DB_USER: quickscale_test_role
        run: |
          ./scripts/test_integration.sh

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./quickscale_core/coverage.xml,./quickscale_cli/coverage.xml,./quickscale_modules/*/coverage.xml
          flags: unittests,integration
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [verify, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Build sdist and wheel
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          BUILD_DIR="$ROOT/dist"
          PACKAGES=("quickscale_core" "quickscale_cli" "quickscale")

          mkdir -p "$BUILD_DIR"

          for pkg in "${PACKAGES[@]}"; do
            pkg_dir="$ROOT/$pkg"
            pyproject="$pkg_dir/pyproject.toml"
            backup="$pkg_dir/pyproject.toml.backup"
            readme_copied=0

            echo "Building $pkg..."

            if [[ ! -f "$pyproject" ]]; then
              echo "pyproject.toml not found for $pkg"
              exit 1
            fi

            cp "$pyproject" "$backup"

            if [[ -f "$ROOT/README.md" ]] && [[ ! -f "$pkg_dir/README.md" ]]; then
              cp "$ROOT/README.md" "$pkg_dir/README.md"
              readme_copied=1
            fi

            sed -i 's|readme = "\.\./README\.md"|readme = "README.md"|' "$pyproject"

            if [[ "$pkg" == "quickscale_cli" ]]; then
              sed -i "s|quickscale-core = {path = \"../quickscale_core\"[^}]*}|quickscale-core = \"^${VERSION}\"|" "$pyproject"
            fi

            if [[ "$pkg" == "quickscale" ]]; then
              sed -i "s|quickscale-core = {path = \"../quickscale_core\"[^}]*}|quickscale-core = \"^${VERSION}\"|" "$pyproject"
              sed -i "s|quickscale-cli = {path = \"../quickscale_cli\"[^}]*}|quickscale-cli = \"^${VERSION}\"|" "$pyproject"
            fi

            rm -rf "$pkg_dir/dist"
            (cd "$pkg_dir" && poetry build)

            cp "$pkg_dir"/dist/* "$BUILD_DIR"/

            mv "$backup" "$pyproject"
            if [[ "$readme_copied" -eq 1 ]]; then
              rm -f "$pkg_dir/README.md"
            fi
          done

          ls -la "$BUILD_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/project/quickscale/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/quickscale/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          CHANGELOG_LINE=$(grep -m1 -E "^- v?${VERSION}\\b" CHANGELOG.md || true)

          if [[ -n "$CHANGELOG_LINE" ]]; then
            echo "Release v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "$CHANGELOG_LINE" >> release_notes.md
          else
            echo "Release v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](https://github.com/Experto-AI/quickscale/blob/main/CHANGELOG.md) for details." >> release_notes.md
          fi

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.verify.outputs.version }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, 'alpha') || contains(needs.verify.outputs.version, 'beta') || contains(needs.verify.outputs.version, 'rc') }}
          fail_on_unmatched_files: true
