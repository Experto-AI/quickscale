name: Nightly BYPASSRLS Tests

# Runs the `-m bypass_rls` migration/FORCE-RLS proof tests that the main CI
# integration job deliberately skips (it pins QUICKSCALE_ALLOW_BYPASSRLS=0 to
# keep the SA58 boot guard active against a NOBYPASSRLS role). Those tests need
# a role WITH the BYPASSRLS attribute to exercise privileged migration DDL, so
# they run here on a separate schedule against a dedicated BYPASSRLS role.
#
# The `-m bypass_rls` filter (via `make test-bypassrls`) excludes the
# restricted-role isolation/boundary tests, which require NOBYPASSRLS — so a
# BYPASSRLS role never produces false isolation failures here.

on:
  schedule:
    # 03:17 UTC daily (off-peak, avoids top-of-hour contention).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  bypassrls:
    name: Run BYPASSRLS-privileged tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      id: install-poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache Poetry dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Create test databases in PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends postgresql-client
        for db in \
          test_quickscale_smoke \
          test_quickscale_analytics \
          test_quickscale_auth \
          test_quickscale_backups \
          test_quickscale_billing \
          test_quickscale_blog \
          test_quickscale_crm \
          test_quickscale_forms \
          test_quickscale_listings \
          test_quickscale_notifications \
          test_quickscale_orgs \
          test_quickscale_social \
          test_quickscale_storage; do
          createdb -h localhost -U postgres "$db" 2>/dev/null || echo "Database $db already exists"
        done

    - name: Provision a BYPASSRLS test role
      run: |
        # Dedicated role WITH BYPASSRLS (the standard provision_test_roles.sh
        # roles are all NOBYPASSRLS by contract). LOGIN + CREATEDB let Django's
        # test runner create the transient test_* databases; BYPASSRLS lets the
        # bypass_rls-marked migration tests exercise privileged DDL.
        ROLE="quickscale_bypassrls_test_role"
        psql -h localhost -U postgres -c \
          "DO \$\$ BEGIN
             IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${ROLE}') THEN
               CREATE ROLE ${ROLE} LOGIN CREATEDB BYPASSRLS NOINHERIT NOSUPERUSER NOCREATEROLE;
             ELSE
               ALTER ROLE ${ROLE} LOGIN CREATEDB BYPASSRLS NOINHERIT NOSUPERUSER NOCREATEROLE;
             END IF;
           END \$\$;"

        # Give the role ownership of every test database template so it can
        # create the test_* databases and manage their schemas.
        for db in \
          test_quickscale_analytics \
          test_quickscale_auth \
          test_quickscale_backups \
          test_quickscale_billing \
          test_quickscale_blog \
          test_quickscale_crm \
          test_quickscale_forms \
          test_quickscale_listings \
          test_quickscale_notifications \
          test_quickscale_orgs \
          test_quickscale_social \
          test_quickscale_storage; do
          psql -h localhost -U postgres -c "ALTER DATABASE \"$db\" OWNER TO ${ROLE};"
          psql -h localhost -U postgres -d "$db" -c "GRANT ALL ON SCHEMA public TO ${ROLE};"
        done
        echo "✓ BYPASSRLS role provisioned and granted database ownership"

    - name: Run BYPASSRLS-privileged tests (make test-bypassrls)
      env:
        # test-bypassrls sets QUICKSCALE_ALLOW_BYPASSRLS=1 itself; point every
        # module's DB user at the BYPASSRLS role.
        QS_ANALYTICS_DB_USER: quickscale_bypassrls_test_role
        QS_AUTH_DB_USER: quickscale_bypassrls_test_role
        QS_BACKUPS_DB_USER: quickscale_bypassrls_test_role
        QS_BILLING_DB_USER: quickscale_bypassrls_test_role
        QS_BLOG_DB_USER: quickscale_bypassrls_test_role
        QS_CRM_DB_USER: quickscale_bypassrls_test_role
        QS_FORMS_DB_USER: quickscale_bypassrls_test_role
        QS_LISTINGS_DB_USER: quickscale_bypassrls_test_role
        QS_NOTIFICATIONS_DB_USER: quickscale_bypassrls_test_role
        QS_ORGS_DB_USER: quickscale_bypassrls_test_role
        QS_SOCIAL_DB_USER: quickscale_bypassrls_test_role
        QS_STORAGE_DB_USER: quickscale_bypassrls_test_role
      run: |
        make test-bypassrls
