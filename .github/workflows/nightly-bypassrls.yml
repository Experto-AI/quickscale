name: Nightly BYPASSRLS Tests

# Runs the `-m bypass_rls` migration/FORCE-RLS proof tests that the main CI
# integration job deliberately deselects (authorization is absent unless the
# value is exactly "1", keeping the boot guard active against a NOBYPASSRLS
# role). Those tests need
# a role WITH the BYPASSRLS attribute to exercise privileged migration DDL, so
# they run here on a separate schedule against a dedicated BYPASSRLS role.
#
# The `-m bypass_rls` filter (via `make test-bypassrls`) excludes the
# restricted-role isolation/boundary tests, which require NOBYPASSRLS — so a
# BYPASSRLS role never produces false isolation failures here.

on:
  # Daily schedule disabled; run on demand or via workflow_call.
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  bypassrls:
    name: Run BYPASSRLS-privileged tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      id: install-poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: 2.4.1
        virtualenvs-create: true
        virtualenvs-in-project: true
      continue-on-error: true

    - name: Retry Poetry install (if failed)
      if: steps.install-poetry.outcome == 'failure'
      run: |
        for i in {1..3}; do
          curl -sSL https://install.python-poetry.org | python3 - --version 2.4.1 && break || sleep 5
        done
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache Poetry dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cache/pypoetry
          .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        poetry install --with dev

    - name: Provision hosted PostgreSQL BYPASSRLS profile
      run: scripts/provision_ci_postgres.sh hosted-setup --profile bypassrls

    - name: Run BYPASSRLS-privileged tests (make test-bypassrls)
      env:
        QUICKSCALE_ALLOW_BYPASSRLS: "1"
      run: |
        make test-bypassrls
