[project]
name = "quickscale-module-backups"
version = "0.87.0"
description = "QuickScale operational backups module with private local and remote artifact workflows"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "quickscale_modules_backups", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
Django = ">=6.0.7,<6.1.0"
django-storages = "^1.14.6"
boto3 = "^1.43.58"
quickscale-core = {path = "../../quickscale_core", develop = true}

[tool.poetry.group.dev.dependencies]
pytest-django = "^4.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"

# Ruff's default rule set, restated explicitly. Any [tool.ruff.*] table makes
# this file Ruff's config root for the module, which shadows the repo-root
# ruff.toml — so this module has always been linted with Ruff's built-in
# defaults, never the shared select. Pinning them makes that implicit
# dependency explicit: a Ruff release that widens its defaults then lands as
# a deliberate opt-in instead of a wall of surprise findings (0.16 widened
# them by ~900 across the modules). Adopting the shared select here is
# worthwhile, but it is its own cleanup.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.mypy.overrides]]
module = "storages.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src", "../../quickscale_core/src"]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --cov=quickscale_modules_backups --cov-report=html --cov-report=term-missing --cov-fail-under=90"
markers = [
    "bypass_rls: test requires BYPASSRLS database privilege (superuser / migration DDL). Skipped when QUICKSCALE_ALLOW_BYPASSRLS is not set.",
]

[tool.coverage.report]
fail_under = 90

[tool.django-stubs]
django_settings_module = "tests.settings"
