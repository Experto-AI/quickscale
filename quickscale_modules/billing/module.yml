name: billing
version: "0.89.0"
description: "Credits-first billing module with Django-owned ledger models and Stripe-backed checkout services"

config:
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_BILLING_ENABLED
      description: "Enable the billing runtime and Stripe-backed services."
      validation: {}

    publishable_key_env_var:
      type: string
      default: "STRIPE_PUBLISHABLE_KEY"
      django_setting: QUICKSCALE_BILLING_PUBLISHABLE_KEY_ENV_VAR
      description: "Environment-variable name containing the Stripe publishable key used by billing checkout flows."
      validation:
        pattern: ^(?:[A-Z][A-Z0-9_]*)?$

    secret_key_env_var:
      type: string
      default: "STRIPE_SECRET_KEY"
      django_setting: QUICKSCALE_BILLING_SECRET_KEY_ENV_VAR
      description: "Environment-variable name containing the Stripe secret key for server-side API calls."
      validation:
        pattern: ^(?:[A-Z][A-Z0-9_]*)?$

    webhook_secret_env_var:
      type: string
      default: "QUICKSCALE_BILLING_WEBHOOK_SECRET"
      django_setting: QUICKSCALE_BILLING_WEBHOOK_SECRET_ENV_VAR
      description: "Environment-variable name containing the Stripe webhook signing secret."
      validation:
        pattern: ^(?:[A-Z][A-Z0-9_]*)?$

    currency:
      type: string
      default: "usd"
      django_setting: QUICKSCALE_BILLING_CURRENCY
      description: "ISO 4217 billing currency code; Checkout refuses a plan whose currency differs from this value or from its Stripe price."
      validation:
        choices:
          - aud
          - brl
          - cad
          - chf
          - czk
          - dkk
          - eur
          - gbp
          - hkd
          - huf
          - inr
          - jpy
          - mxn
          - myr
          - nok
          - nzd
          - php
          - pln
          - ron
          - sek
          - sgd
          - thb
          - try
          - usd
          - zar

    api_rate_limit:
      type: string
      default: "30/hour"
      django_setting: QUICKSCALE_BILLING_API_RATE_LIMIT
      description: "Throttle rate per client for billing's Stripe-calling checkout and portal endpoints. Format: '<count>/<period>'."
      validation:
        pattern: ^\d+/(second|minute|hour|day)$

    transactions_per_page:
      type: integer
      default: 25
      django_setting: QUICKSCALE_BILLING_TRANSACTIONS_PER_PAGE
      description: "Number of credit transactions per page in the ledger list API."
      validation:
        min: 1

    plans_per_page:
      type: integer
      default: 25
      django_setting: QUICKSCALE_BILLING_PLANS_PER_PAGE
      description: "Number of plans per page in the public plan catalog API."
      validation:
        min: 1

  immutable: {}

# Declared DRF throttle scopes (rule 32): each scope names the option whose
# resolved value is its rate, so the adapter carries no rate map.
throttle_scopes:
  quickscale_billing_checkout: api_rate_limit
  quickscale_billing_portal: api_rate_limit

# Non-live CI placeholders: each key names a declared option whose
# resolved value is the environment variable the enabled module's startup
# check reads, and the placeholder is what the managed
# .github/quickscale-ci-env file sets under it, so the user-owned CI
# workflow names no module value.
ci_env:
  publishable_key_env_var: pk_test_ci
  secret_key_env_var: sk_test_ci
  webhook_secret_env_var: whsec_test_ci

# Generated-project blocks: the credential variable names the Compose
# backend service passes through from the host environment. The names resolve
# from the project's configured options, so a renamed *_env_var follows.
project_blocks:
  compose_env:
    - publishable_key_env_var
    - secret_key_env_var
    - webhook_secret_env_var

# Frontend resource contract consumed by the managed theme hook
# (frontend/src/quickscaleSeam.hooks.ts). Paths are module-relative API
# subpaths appended to the module's moduleApiPaths base; the payload types are
# the response shapes those paths return, so a user-owned page imports both
# instead of restating them.
frontend_resources:
  paths:
    subscription: subscription/
    balance: balance/
  payload_types:
    OrgPlan:
      name: string
      slug: string
      credits_per_period: number
      price_cents: number
      currency: string
      billing_interval: string
    OrgBalanceResponse:
      balance: number
      updated_at: "string | null"
    OrgSubscriptionResponse:
      plan: OrgPlan
      status: string
      checkout_expires_at: "string | null"
      current_period_start: "string | null"
      current_period_end: "string | null"

# Module-owned operations text: the managed quickscale-operations.md page
# renders this section, and the generated project's OPERATIONS.md links that
# page once instead of restating a module value.  The text's {name} tokens
# resolve when the page renders: a declared value below, a declared option's
# configured value, or a core contract token.
operations:
  title: "Stripe Billing"
  values:
    webhook_endpoint: /billing/webhooks/stripe/
    webhook_events:
      - invoice.paid
      - invoice.payment_failed
      - checkout.session.completed
      - checkout.session.expired
      - checkout.session.async_payment_succeeded
      - checkout.session.async_payment_failed
      - customer.subscription.*
  text: |
    Billing talks to Stripe at API version {stripe_api_version}, and its webhook endpoint must
    use that same version.

    1. In the Stripe Dashboard, create a webhook endpoint for
       `https://<your-host>{webhook_endpoint}` at API version `{stripe_api_version}`,
       subscribed to the billing events you use: {webhook_events}.
    2. Set the endpoint's signing secret in the configured webhook-secret variable
       (`{webhook_secret_env_var}`): the name comes from
       `modules.billing.webhook_secret_env_var` in `quickscale.yml`.
    3. Set the Stripe secret and publishable key variables before enabling billing traffic.

    > **Upgrade note:** a webhook endpoint on an older API version stops processing billing
    > webhooks (`500` responses) until it is recreated at `{stripe_api_version}`. Events
    > refused under the old version are not credited automatically, so reconcile them once the
    > endpoint is on `{stripe_api_version}`: resend the event to that endpoint (Stripe
    > Dashboard **Resend**, or `stripe events resend <event_id>
    > --webhook-endpoint=<endpoint_id>`, up to 30 days) and confirm it is accepted; when an
    > event is still refused or is outside the resend window, credit the affected invoice once
    > through the module's `credit_user` service from a Django shell so the balance and ledger
    > stay consistent.

required_modules:
  - orgs

dependencies:
  - djangorestframework
  - stripe
  - sqlparse
  - quickscale-core

# Retired option keys are refused by name with the message declared here.
retired_options:
  billing_currency: >-
    Legacy config key 'billing_currency' is no longer supported. Use 'currency'
    instead.

contract_vintage:
  id: sa280-stripe-webhook-version
  minimum: "0.89.0"
  manual_adoption_steps:
    - "Recreate the Stripe webhook endpoint at API version {stripe_api_version} and point it at /billing/webhooks/stripe/: an endpoint on an older API version stops processing billing webhooks (500s) until it is recreated, and events refused under the old version are not credited automatically, so reconcile them once the endpoint is updated — resend each event to the new endpoint (Stripe Dashboard Resend, or stripe events resend --webhook-endpoint=<endpoint_id>, up to 30 days) and, when an event is still refused or outside the resend window, credit the affected invoice once through the module's credit_user service."

# ---------------------------------------------------------------------------
# Manifest derivation rules
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - quickscale_modules_billing
      description: "Billing Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - billing/
            - quickscale_modules_billing.urls
      description: "Billing URL includes"

  option_derivations:
    publishable_key_env_var:
      normalization_rules:
        - source_key: publishable_key_env_var
          target_key: publishable_key_env_var
          rule_type: strip
    secret_key_env_var:
      normalization_rules:
        - source_key: secret_key_env_var
          target_key: secret_key_env_var
          rule_type: strip
    webhook_secret_env_var:
      normalization_rules:
        - source_key: webhook_secret_env_var
          target_key: webhook_secret_env_var
          rule_type: strip
    currency:
      normalization_rules:
        - source_key: currency
          target_key: currency
          rule_type: strip
        - source_key: currency
          target_key: currency
          rule_type: lowercase
    api_rate_limit:
      normalization_rules:
        - source_key: api_rate_limit
          target_key: api_rate_limit
          rule_type: strip
          description: "Strip whitespace from api_rate_limit"
