{% extends "quickscale_billing/base.html" %}

{% block title %}Purchase canceled{% endblock %}

{% block billing_content %}
<div class="status-page">
    <div id="billing-purchase-root" data-purchase-status="cancel" class="status-card">
        <div class="status-icon">!</div>
        <h1>Purchase canceled</h1>
        <p>Your checkout session ended before Stripe completed the payment, so no charge was made.</p>
        <div class="actions">
            <a class="button button-primary" href="{{ pricing_url }}">Try again</a>
            <a class="button button-secondary" href="/">Back to app</a>
        </div>
    </div>
</div>
{% endblock %}
