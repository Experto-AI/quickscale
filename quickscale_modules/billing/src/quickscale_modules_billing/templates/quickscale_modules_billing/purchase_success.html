<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase complete</title>
    <style>
        :root {
            color-scheme: light;
            --page-bg: linear-gradient(180deg, #eff8f2 0%, #f7fafc 100%);
            --surface: rgba(255, 255, 255, 0.96);
            --text: #153127;
            --muted: #4b6057;
            --border: rgba(21, 49, 39, 0.12);
            --accent: #1b7a4b;
            --accent-soft: rgba(27, 122, 75, 0.12);
            --shadow: 0 24px 60px rgba(21, 49, 39, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: "Avenir Next", "Helvetica Neue", sans-serif;
            background: var(--page-bg);
            color: var(--text);
        }

        .status-card {
            width: min(100%, 34rem);
            padding: 2.2rem;
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .status-icon {
            display: inline-grid;
            place-items: center;
            width: 4rem;
            height: 4rem;
            margin-bottom: 1rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        h1 { margin: 0 0 0.85rem; font-size: clamp(2rem, 4vw, 2.8rem); }
        p { margin: 0; line-height: 1.7; color: var(--muted); }
        .status-note { margin-top: 0.75rem; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1.6rem;
        }

        .button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 2.9rem;
            padding: 0.85rem 1.25rem;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
        }

        .button-primary { background: var(--accent); color: #ffffff; }
        .button-secondary { border: 1px solid var(--border); color: var(--text); background: #ffffff; }
    </style>
</head>
<body>
    <main>
        <div id="billing-purchase-root" data-purchase-status="success" class="status-card">
            <div class="status-icon">OK</div>
            <h1>Purchase complete</h1>
            <p>Your credit purchase has been confirmed. Credits may take a moment to appear on your balance.</p>
            <p class="status-note">If Stripe has just redirected you back, refresh the dashboard after processing finishes.</p>
            <div class="actions">
                <a class="button button-primary" href="{% url 'quickscale_billing:billing-dashboard' %}">Go to dashboard</a>
                <a class="button button-secondary" href="/">Back to app</a>
            </div>
        </div>
    </main>
</body>
</html>
