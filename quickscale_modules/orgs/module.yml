name: orgs
version: "0.89.0"
description: "Organizations and multi-tenant foundations with memberships and invitations"

config:
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_ORGS_ENABLED
      description: "Enable the orgs module. Off keeps the module installed with its data intact and mounts none of its organization URLs."
      validation: {}

    mode:
      type: string
      default: "solo"
      django_setting: QUICKSCALE_ORGS_MODE
      description: "Organization runtime mode (solo or saas)"
      validation:
        choices: ["solo", "saas"]

    invite_rate_limit:
      type: string
      default: "20/day"
      django_setting: QUICKSCALE_ORGS_INVITE_RATE_LIMIT
      description: "Throttle rate for organization invitation sends, per sender and per organization. Format: '<count>/<period>'."
      validation:
        pattern: ^\d+/(second|minute|hour|day)$

    pending_invitation_limit:
      type: integer
      default: 50
      django_setting: QUICKSCALE_ORGS_PENDING_INVITATION_LIMIT
      description: "Maximum active pending invitations one organization may hold; further invitations are refused until older ones are revoked or expire."
      validation:
        min: 1
  immutable: {}

# Declared DRF throttle scopes (rule 32): each scope names the option whose
# resolved value is its rate, so the adapter carries no rate map.
throttle_scopes:
  quickscale_orgs_invite: invite_rate_limit
  quickscale_orgs_invite_organization: invite_rate_limit

required_modules:
  - auth
  - notifications

dependencies:
  - djangorestframework
  - django-allauth
  - sqlparse
  - quickscale-core

# Frontend resource contract consumed by the managed theme hook
# (frontend/src/quickscaleSeam.hooks.ts). Paths are module-relative API
# subpaths appended to the module's moduleApiPaths base; a {parameter}
# placeholder renders a typed builder. The payload types are the response
# shapes those paths return, so a user-owned page imports both instead of
# restating them.
frontend_resources:
  paths:
    detail: "{orgSlug}/"
    members: "{orgSlug}/members/"
    membersInvite: "{orgSlug}/members/invite/"
    memberRole: "{orgSlug}/members/{membershipId}/role/"
    memberRemove: "{orgSlug}/members/{membershipId}/remove/"
    invitationRevoke: "{orgSlug}/members/invitations/{invitationId}/revoke/"
    settings: "{orgSlug}/settings/"
  payload_types:
    OrgRole: "'viewer' | 'member' | 'admin' | 'owner'"
    OrgSummary:
      id: string
      name: string
      slug: string
      is_personal: boolean
      role?: "OrgRole | null"
      role_label?: string
      member_count?: number
    OrgActor:
      role: "OrgRole | null"
      is_owner_like: boolean
    OrgDetailResponse:
      organization: OrgSummary
      actor: OrgActor
    OrgListResponse:
      organizations: "OrgSummary[]"
    OrgCreateResponse:
      organization: OrgSummary
      next_url: string
      billing_pricing_url: "string | null"
    OrgUser:
      id: string
      username: string
      email: string
      display_name: string
    OrgMember:
      id: number
      role: OrgRole
      role_label: string
      joined_at: string
      user: OrgUser
    OrgInvitation:
      id: string
      email: string
      role: OrgRole
      role_label: string
      expires_at: string
    OrgRoleChoice:
      value: OrgRole
      label: string
    OrgMembersResponse:
      organization: OrgSummary
      actor: OrgActor
      members: "OrgMember[]"
      pending_invitations: "OrgInvitation[]"
      role_choices: "OrgRoleChoice[]"
    OrgSettingsResponse:
      organization: OrgSummary
    OrgInvitationResponse:
      invitation: OrgInvitation
    OrgMemberResponse:
      member: OrgMember
    OrgMemberRemovedResponse:
      status: "'removed'"
      member_id: number
    OrgInvitationRevokedResponse:
      status: "'revoked'"
      invitation_id: string

# Generated-project blocks. The generated Makefile and CI workflow
# carry one managed region per block; orgs owns the tenant-isolation lane and
# the test environment that lets its startup check run, so core names no
# module and a module release changes only this declaration.
project_blocks:
  make_targets:
    - name: check-tenant-isolation
      help: "Run tenant isolation conformance check"
      recipe:
        - "RUNTIME_DATABASE_URL='' QUICKSCALE_PRIVILEGED_COMMAND=migrate poetry run python manage.py migrate"
        - "QUICKSCALE_ALLOW_BYPASSRLS=1 poetry run python manage.py quickscale_orgs_check_tenant_isolation --postgres-only --json"
    - name: test-tenant-isolation
      help: "Run the two-organization isolation test (needs a CREATEDB runtime role)"
      recipe:
        - "QUICKSCALE_REQUIRE_TENANT_ISOLATION=1 poetry run pytest tests/test_tenant_isolation.py -m tenant_isolation -o addopts="
  make_test_env:
    QUICKSCALE_ALLOW_BYPASSRLS: "1"
  ci_test_env:
    QUICKSCALE_ALLOW_BYPASSRLS: "1"
  ci_steps: |
    - name: Run migrations
      run: poetry run python manage.py migrate --noinput
      env:
        DATABASE_URL: postgres://postgres@localhost/postgres
        DJANGO_SETTINGS_MODULE: "{package_name}.settings.local"
        QUICKSCALE_ALLOW_BYPASSRLS: "1"

    - name: Run tenant isolation conformance check
      run: poetry run python manage.py quickscale_orgs_check_tenant_isolation --postgres-only --json
      env:
        DATABASE_URL: postgres://postgres@localhost/postgres
        DJANGO_SETTINGS_MODULE: "{package_name}.settings.local"
        QUICKSCALE_ALLOW_BYPASSRLS: "1"
  ci_jobs: |
    tenant-isolation:
      # Two-organization isolation runs against a NOSUPERUSER/NOBYPASSRLS role.
      # The role keeps CREATEDB only so pytest-django can create its own test
      # database; the isolation test never connects with the superuser role.
      runs-on: ubuntu-24.04
      services:
        postgres:
          image: postgres:{postgres_patch_version}
          env:
            POSTGRES_HOST_AUTH_METHOD: trust
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
          ports:
            - 5432:5432
      env:
        DATABASE_URL: postgres://postgres@localhost/postgres
        DJANGO_SETTINGS_MODULE: "{package_name}.settings.local"

      steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Load module CI environment
        run: cat .github/quickscale-ci-env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "{python_patch_version}"

      - name: Install PostgreSQL {postgres_version} client tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          distro_codename="$(
            . /etc/os-release
            echo "$VERSION_CODENAME"
          )"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt ${distro_codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-{postgres_version}
          echo "/usr/lib/postgresql/{postgres_version}/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL {postgres_version} client tooling
        run: |
          test -x /usr/lib/postgresql/{postgres_version}/bin/psql
          test "$(command -v psql)" = "/usr/lib/postgresql/{postgres_version}/bin/psql"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run migrations once
        run: poetry run python manage.py migrate --noinput
        env:
          RUNTIME_DATABASE_URL: ""
          QUICKSCALE_PRIVILEGED_COMMAND: migrate

      - name: Create restricted runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'quickscale_test_runtime') THEN
              CREATE ROLE quickscale_test_runtime LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS NOCREATEROLE;
            ELSE
              ALTER ROLE quickscale_test_runtime LOGIN CREATEDB NOSUPERUSER NOBYPASSRLS NOCREATEROLE;
            END IF;
          END
          $$;
          GRANT CONNECT ON DATABASE postgres TO quickscale_test_runtime;
          SQL

      - name: Run two-organization isolation test
        run: make test-tenant-isolation
        env:
          RUNTIME_DATABASE_URL: postgres://quickscale_test_runtime@localhost:5432/postgres

contract_vintage:
  id: sa221-orgs-check-id
  minimum: "0.89.0"
  manual_adoption_steps:
    - "Declare `provider_id_classification` on every project-owned tenant model that carries a non-relational `*_id` field: map each field to 'provider-backed' when it identifies provider-held state (purge refuses while a row carries a value), or to 'not-provider-backed' when it is project-internal. The orgs system check fails `manage.py check` and `migrate` with `quickscale_orgs.E001` until every such field is classified, so declare the mapping before the next deploy."

# Retired Django setting names are refused at startup with the message
# declared here; the generic settings check reads this section.
retired_settings:
  QUICKSCALE_MODE: >-
    Legacy setting 'QUICKSCALE_MODE' is no longer supported. Use
    'QUICKSCALE_ORGS_MODE' instead.

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - quickscale_modules_orgs
      description: "Orgs Django app label"

    - wiring_field: middleware
      derivation_type: static
      expression:
        value:
          - quickscale_modules_orgs.middleware.TenantMiddleware
      description: "Orgs tenant middleware"

    - wiring_field: pre_home_url_includes
      derivation_type: conditional
      source_options: [mode]
      expression:
        branches:
          solo:
            - ["orgs/", "quickscale_modules_orgs.urls"]
          saas: []
      description: "Mount orgs before home in solo mode"

    - wiring_field: url_includes
      derivation_type: conditional
      source_options: [mode]
      expression:
        branches:
          solo: []
          saas:
            - ["orgs/", "quickscale_modules_orgs.urls"]
      description: "Mount orgs after home in saas mode"

  option_derivations:
    mode:
      normalization_rules:
        - source_key: mode
          target_key: mode
          rule_type: strip
          description: "Strip whitespace from mode"
        - source_key: mode
          target_key: mode
          rule_type: lowercase
          description: "Canonicalize mode to lowercase"
    invite_rate_limit:
      normalization_rules:
        - source_key: invite_rate_limit
          target_key: invite_rate_limit
          rule_type: strip
          description: "Strip whitespace from invite_rate_limit"
