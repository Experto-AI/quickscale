name: orgs
version: "0.89.0"
description: "Organizations and multi-tenant foundations with memberships and invitations"

config:
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_ORGS_ENABLED
      description: "Enable the orgs module. Off keeps the module installed with its data intact and mounts none of its organization URLs."
      validation: {}

    mode:
      type: string
      default: "solo"
      django_setting: QUICKSCALE_ORGS_MODE
      description: "Organization runtime mode (solo or saas)"
      validation:
        choices: ["solo", "saas"]
  immutable: {}

required_modules:
  - auth
  - notifications

dependencies:
  - djangorestframework>=3.17.2
  - django-allauth>=65.18.0,<66.0.0

contract_vintage:
  id: sa221-orgs-check-id
  minimum: "0.89.0"
  manual_adoption_steps:
    - "Declare `provider_id_classification` on every project-owned tenant model that carries a non-relational `*_id` field: map each field to 'provider-backed' when it identifies provider-held state (purge refuses while a row carries a value), or to 'not-provider-backed' when it is project-internal. The orgs system check fails `manage.py check` and `migrate` with `quickscale_orgs.E001` until every such field is classified, so declare the mapping before the next deploy."

middleware:
  - quickscale_modules_orgs.middleware.TenantMiddleware

settings:
  QUICKSCALE_ORGS_MODE: solo

derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - quickscale_modules_orgs
      description: "Orgs Django app label"

    - wiring_field: pre_home_url_includes
      derivation_type: conditional
      source_options: [mode]
      expression:
        branches:
          solo:
            - ["orgs/", "quickscale_modules_orgs.urls"]
          saas: []
      description: "Mount orgs before home in solo mode"

    - wiring_field: url_includes
      derivation_type: conditional
      source_options: [mode]
      expression:
        branches:
          solo: []
          saas:
            - ["orgs/", "quickscale_modules_orgs.urls"]
      description: "Mount orgs after home in saas mode"

  option_derivations:
    mode:
      normalization_rules:
        - source_key: mode
          target_key: mode
          rule_type: strip
          description: "Strip whitespace from mode"
        - source_key: mode
          target_key: mode
          rule_type: lowercase
          description: "Canonicalize mode to lowercase"
