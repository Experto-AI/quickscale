# CRM Module Manifest
# Defines configuration options and their mutability for the CRM module
# See decisions.md §Module Manifest Architecture for schema specification

name: crm
version: "0.89.0"
description: "Lightweight CRM module with contacts, companies, deals, and pipeline management"

config:
  # Mutable options - can be changed after embed via quickscale apply
  # These update Django settings.py automatically
  mutable:
    enable_api:
      type: boolean
      default: true
      django_setting: CRM_ENABLE_API
      description: "Enable REST API endpoints at /crm/api/"

    deals_per_page:
      type: integer
      default: 25
      django_setting: CRM_DEALS_PER_PAGE
      description: "Number of deals per page in list views"

    contacts_per_page:
      type: integer
      default: 50
      django_setting: CRM_CONTACTS_PER_PAGE
      description: "Number of contacts per page in list views"

  immutable: {}

required_modules:
  - orgs>=0.86.0

implies:
  - name: orgs

# Dependencies required by this module
dependencies:
  - djangorestframework>=3.17.2
  - django-filter>=26.1

contract_vintage:
  minimum: "0.89.0"
  manual_adoption_steps:
    - "Compare and manually adopt the current templates/base.html, templates/index.html, and generated templates/social/*.html files so every DEBUG host loads the Vite-served /static/frontend/src/index.css, production loads frontend/assets/index.css, and the shell restores the persisted theme."
    - "Compare and manually adopt the current frontend/vite.config.ts static proxy and exact HTTP/WebSocket Host enforcement so Vite serves /static/frontend/ directly and accepts only the effective browser Host: configured QUICKSCALE_FRONTEND_ORIGIN, or localhost:QUICKSCALE_FRONTEND_HOST_PORT when blank."
    - "Compare and manually adopt the current <package>/settings/local.py QUICKSCALE_FRONTEND_HOST_PORT and validated QUICKSCALE_FRONTEND_ORIGIN settings so DEBUG React and module pages use the same browser-visible Vite stylesheet URL and malformed origins fail explicitly."
    - "Compare and manually adopt the current docker-compose.yml frontend workflow so it builds assets before starting Vite, publishes ${QUICKSCALE_FRONTEND_HOST_PORT:-5173}:5173, passes the port and optional full origin to Vite and Django, probes Vite with the effective Host, and waits for the Vite-served stylesheet."
    - "Run pnpm dev alongside Django for DEBUG module pages; run pnpm build so static/frontend/assets/index.css exists before serving non-DEBUG module pages."

# ---------------------------------------------------------------------------
# Manifest derivation rules (T2.3 Phase 3)
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - quickscale_modules_crm
      description: "CRM Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - ""
            - quickscale_modules_crm.urls
      description: "CRM URL includes"

  option_derivations:
    deals_per_page:
      derived_settings:
        - setting_key: CRM_DEALS_PER_PAGE
          source_options: [deals_per_page]
          derivation_type: direct
          expression:
            option: deals_per_page
          default: 25
          description: "Number of deals per page"

    contacts_per_page:
      derived_settings:
        - setting_key: CRM_CONTACTS_PER_PAGE
          source_options: [contacts_per_page]
          derivation_type: direct
          expression:
            option: contacts_per_page
          default: 50
          description: "Number of contacts per page"

    enable_api:
      derived_settings:
        - setting_key: CRM_ENABLE_API
          source_options: [enable_api]
          derivation_type: direct
          expression:
            option: enable_api
          default: true
          description: "Enable REST API endpoints"
