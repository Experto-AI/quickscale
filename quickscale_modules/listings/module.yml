# Listings Module Manifest
# Defines configuration options and their mutability for the listings module

name: listings
version: "0.89.0"
description: "Generic listings module for marketplace-style products"

config:
  mutable:
    enabled:
      type: boolean
      default: true
      django_setting: QUICKSCALE_LISTINGS_ENABLED
      description: "Enable the listings module. Off keeps the module installed with its data intact and mounts none of its public URLs."
      validation: {}

    per_page:
      type: integer
      default: 12
      django_setting: QUICKSCALE_LISTINGS_PER_PAGE
      description: "Number of listings per page"
      validation:
        min: 1

    api_rate_limit:
      type: string
      default: "5/hour"
      django_setting: QUICKSCALE_LISTINGS_API_RATE_LIMIT
      description: "Throttle rate for the listing publish API, keyed per authenticated user. Format: '<count>/<period>'."
      validation:
        pattern: ^\d+/(second|minute|hour|day)$

  immutable: {}

required_modules:
  - orgs

dependencies:
  - djangorestframework
  - django-filter
  - django-markdownx
  - Pillow
  - quickscale-core

# Retired option keys are refused by name with the message declared here.
retired_options:
  listings_per_page: >-
    Legacy config key 'listings_per_page' is no longer supported. Use
    'per_page' instead.

# Retired Django setting names are refused at startup with the message
# declared here; the generic settings check reads this section.
retired_settings:
  LISTINGS_PER_PAGE: >-
    Legacy setting 'LISTINGS_PER_PAGE' is no longer supported. Use
    'QUICKSCALE_LISTINGS_PER_PAGE' instead.

# ---------------------------------------------------------------------------
# Manifest derivation rules
# ---------------------------------------------------------------------------
derivation:
  wiring_projections:
    - wiring_field: apps
      derivation_type: static
      expression:
        value:
          - rest_framework
          - django_filters
          - markdownx
          - quickscale_modules_listings
      description: "Listings Django app labels"
    - wiring_field: url_includes
      derivation_type: static
      expression:
        value:
          - - listings/
            - quickscale_modules_listings.urls
          - - markdownx/
            - quickscale_modules_listings.markdownx_urls
      description: "Listings URL includes; the Markdownx editor mount is staff-guarded"

    - wiring_field: spa_routes
      derivation_type: static
      expression:
        value:
          - - ^listings/?$
            - shell
      description: "Listings React shell route; rendered after the module's own includes (rule 41)"

  # Static editor settings the listings module always contributes while
  # installed.
  derived_settings:
    - setting_key: MARKDOWNX_MARKDOWN_EXTENSIONS
      derivation_type: static
      expression:
        value:
          - markdown.extensions.fenced_code
          - markdown.extensions.tables
          - markdown.extensions.toc

  option_derivations:
    per_page:
      normalization_rules:
        - source_key: per_page
          target_key: per_page
          rule_type: strip
          description: "Strip whitespace from per_page"
    api_rate_limit:
      normalization_rules:
        - source_key: api_rate_limit
          target_key: api_rate_limit
          rule_type: strip
          description: "Strip whitespace from api_rate_limit"
