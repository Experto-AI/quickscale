[project]
name = "quickscale-module-blog"
version = "0.87.0"
description = "QuickScale blog module with Markdown support and RSS feeds"
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "quickscale_modules_blog", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
Django = ">=6.0.5,<6.1.0"
django-markdownx = "^4.0.9"
Pillow = ">=12.2.0,<13.0.0"

[tool.poetry.group.dev.dependencies]
# Minimal dev dependencies for standalone testing
# pytest, pytest-cov, ruff, mypy centralized in root pyproject.toml (monorepo)
# or provided by user's project (standalone embed)
pytest-django = "^4.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff and mypy configurations centralized in root ruff.toml and mypy.ini
# Package-specific overrides:

[tool.ruff]
target-version = "py313"

[[tool.mypy.overrides]]
module = "markdownx.*"
ignore_missing_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src", "../orgs/src", "../.."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --cov=src/quickscale_modules_blog --cov-report=html --cov-report=term-missing --cov-fail-under=90"
markers = [
    "bypass_rls: test requires BYPASSRLS database privilege (superuser / migration DDL). Skipped when QUICKSCALE_ALLOW_BYPASSRLS is not set.",
    "isolation: cross-tenant isolation tests (roadmap Finding 14 / F11 rollout)",
]

[tool.coverage.report]
fail_under = 90
# Per-file minimum target: 80% (enforced via code review)
