# Blog Module Manifest
# Defines configuration options and their mutability for the blog module

name: blog
version: "0.73.0"
description: "Markdown-powered blog module"

config:
  mutable:
    posts_per_page:
      type: integer
      default: 10
      django_setting: BLOG_POSTS_PER_PAGE
      description: "Number of blog posts per page"

    api_rate_limit:
      type: string
      default: "5/hour"
      django_setting: BLOG_API_RATE_LIMIT
      description: "Throttle rate for authenticated blog API requests (per IP). Format: '<count>/<period>'."

    enable_rss:
      type: boolean
      default: true
      django_setting: BLOG_ENABLE_RSS
      description: "Enable RSS routes at runtime"

  immutable:
    org_routing_enabled:
      type: boolean
      default: false
      django_setting: BLOG_ORG_ROUTING_ENABLED
      description: "Enable org-scoped blog routing (Phase 2 of F11.11)"

required_modules:
  - orgs

dependencies:
  - django-markdownx>=4.0
  - Pillow>=12.1.1,<13.0.0

django_apps:
  - markdownx
  - quickscale_modules_blog
