[project]
name = "quickscale-devtools"
version = "0.86.0"
description = "Maintainer-only development tools for QuickScale"
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Experto AI", email = "victor@experto.ai"}]
keywords = ["django", "scaffolding", "project-generator", "saas", "maintainer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Experto-AI/quickscale"
Repository = "https://github.com/Experto-AI/quickscale"
Documentation = "https://github.com/Experto-AI/quickscale/tree/main/docs"

[tool.poetry]
package-mode = true
packages = [{include = "quickscale_devtools", from = "src"}]
include = ["src/quickscale_devtools/**/*"]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
quickscale-core = {path = "../quickscale_core"}

[tool.poetry.group.dev.dependencies]
# Dev dependencies centralized in root pyproject.toml
# Use: poetry install from repository root

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff and mypy configurations centralized in root ruff.toml and mypy.ini
# Package-specific isort override
[tool.ruff.lint.isort]
known-first-party = ["quickscale_devtools", "quickscale_core"]
